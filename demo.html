<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>部署測試</title>
<style>
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;
    background:#f5f7f6;color:#1c1c1e;padding:24px;text-align:center;
  }
  .box{max-width:420px}
  .tick{
    width:88px;height:88px;border-radius:50%;background:#2A8740;color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:46px;margin:0 auto 22px;
  }
  h1{margin:0 0 10px;font-size:24px}
  p{margin:0;color:#6b7280;font-size:15px;line-height:1.7}
  .url{
    margin-top:22px;font-size:12px;color:#9ca3af;word-break:break-all;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="tick">✓</div>
    <h1>部署成功</h1>
    <p>呢頁由 GitHub Pages 提供。<br>見到呢個畫面，代表之後放上去嘅活動頁都開得到。</p>
    <div class="url" id="u"></div>
  </div>
  <script>document.getElementById('u').textContent = location.href;</script>
</body>
</html>
