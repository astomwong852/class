<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>課堂活動</title>
<style>
  :root{
    --ink:#1a1a1a; --grey:#6b6b6b; --rule:#cfcfcf; --accent:#8a3324; --paper:#ffffff;
    --fs: clamp(0.98rem, 0.94rem + 0.2vw, 1.06rem);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","PingFang HK",
                "Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    background:var(--paper);color:var(--ink);
    font-size:var(--fs);line-height:1.78;letter-spacing:0;
    padding:1.75rem 1.25rem 3rem;
    padding-top:calc(1.75rem + env(safe-area-inset-top));
    -webkit-text-size-adjust:100%;
  }

  .masthead{max-width:47.5rem;margin:0 auto 1.6rem;padding-bottom:.75rem;
    border-bottom:2px solid var(--ink)}
  .eyebrow{font-size:.75rem;color:var(--grey);letter-spacing:.02em}
  h1{font-size:clamp(1.7rem,1.4rem + 1.2vw,2.1rem);line-height:1.12;
    letter-spacing:-0.018em;margin:.35rem 0 .15rem;font-weight:700}
  .byline{font-size:.8rem;color:var(--grey);letter-spacing:.01em}

  main{max-width:47.5rem;margin:0 auto}
  ol.acts{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
  ol.acts li{border-bottom:1px solid var(--rule)}
  ol.acts a{
    display:flex;align-items:baseline;gap:.9rem;text-decoration:none;color:inherit;
    padding:.95rem .2rem;transition:background-color 110ms var(--ease-out);
  }
  ol.acts a:active{background:#f2f2f2}
  .no{flex:0 0 2rem;font-size:.78rem;color:var(--accent);font-variant-numeric:tabular-nums;
    letter-spacing:.04em}
  .body{flex:1;min-width:0}
  .body b{display:block;font-weight:700;line-height:1.45;letter-spacing:-0.005em}
  .body span{display:block;font-size:.82rem;color:var(--grey);margin-top:.1rem;line-height:1.55}
  .tag{flex:0 0 auto;font-size:.7rem;color:var(--grey);letter-spacing:.08em;
    border:1px solid var(--rule);padding:.05rem .35rem;align-self:center}

  /* 第一張卡：封面式大卡（唔用清單行） */
  .hero{
    display:block;text-decoration:none;color:var(--paper);background:var(--ink);
    padding:1.15rem 1.2rem 1.05rem;margin:0 0 1.4rem;position:relative;overflow:hidden;
    transition:transform 140ms var(--ease-out);
  }
  .hero:active{transform:scale(.995)}
  .hero .kicker{display:block;font-size:.66rem;letter-spacing:.18em;opacity:.6}
  .hero b{display:block;font-size:clamp(1.24rem,1.05rem + .85vw,1.58rem);
    line-height:1.28;letter-spacing:-0.012em;margin:.5rem 0 .4rem;font-weight:700}
  .hero i{display:block;font-style:normal;font-size:.84rem;line-height:1.6;opacity:.76}
  .hero .go{display:inline-flex;align-items:center;gap:.35rem;margin-top:.95rem;
    font-size:.8rem;font-weight:600;border-bottom:1px solid currentColor;padding-bottom:.08rem}
  .hero .ring{position:absolute;right:-34px;bottom:-46px;width:158px;height:158px;
    border:1px solid rgba(255,255,255,.2);border-radius:50%;pointer-events:none}
  .hero .wm{position:absolute;right:10px;bottom:-26px;font-size:104px;font-weight:800;
    letter-spacing:-0.05em;line-height:1;opacity:.07;pointer-events:none;
    font-variant-numeric:tabular-nums}
  .hero .tag{position:absolute;top:1rem;right:1.05rem;border-color:rgba(255,255,255,.35);
    color:var(--paper);opacity:.85}

  .empty{padding:1.6rem .2rem;color:var(--grey);font-size:.9rem;line-height:1.75}
  .empty code{font-size:.85em;background:#f2f2f2;padding:.05rem .3rem}

  footer{max-width:47.5rem;margin:2rem auto 0;padding-top:1rem;
    border-top:1px solid var(--rule);font-size:.72rem;color:var(--grey)}

  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  @media (prefers-reduced-motion: reduce){
    ol.acts a{transition:background-color 100ms linear}
  }
  @media (prefers-color-scheme: dark){
    :root{--ink:#eeeeee;--grey:#9a9a9a;--rule:#3a3a3a;--paper:#141414;--accent:#c98a78}
    ol.acts a:active{background:#242424}
    .empty code{background:#242424}
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="eyebrow">鳳溪第一小學</div>
  <h1>課堂活動</h1>
  <div class="byline" id="sub">請選擇活動</div>
</header>

<main>
  <a class="hero" id="hero" hidden></a>
  <ol class="acts" id="list"></ol>
</main>

<footer>科創科 · 黃智仁　｜　學生掃 QR Code 即開，不需登入</footer>

<script>
/* ============================================================
   加活動只需要改下面呢個陣列：
   { title: 標題, desc: 一句說明, file: 檔案名, tag: 科目簡稱 }
   file 放喺同一個資料夾，push 上去就生效。
   ============================================================ */
const ACTIVITIES = [
  { title: "Kahoot 即時問答（全班一齊玩）", desc: "主持人大屏出題　手機輸 PIN 搶答　即時計分排行榜", file: "https://fk1ps-quiz.fk1ps.workers.dev/host", tag: "全科" },
  { title: "村落爭霸（Travian 風格）", desc: "建村莊　升資源場　訓練部隊　出兵掠奪　本地存檔、離線照樣計資源", file: "village-clash.html", tag: "遊戲" },
  { title: "倍數獵人（P4 Ch.17 熱身）", desc: "60 秒　Pixel 像素動畫＋音效　輸入班別學號　今日排行榜　AI 生成課件", file: "multiple-hunter-p4.html", tag: "數學 4" },
  { title: "約分三個遊戲（一頁試玩）", desc: "Go Play 入口　貪吃蛇／瑪利歐／約分大挑戰　一頁切換", file: "fraction-three-games.html", tag: "數學 5" },
  { title: "貪吃蛇約分（小五 5N1）", desc: "10 題　3 種難度（蛇速／倒數）　3 條命　老師可換題庫", file: "snake-fraction-p5.html", tag: "數學 5" },
  { title: "小五數學　約分大挑戰", desc: "輸入分子分母　12 題　1–3 級難度（5N1 擴分和約分）", file: "fraction-p5-quiz.html", tag: "數學 5" },
  { title: "瑪利歐約分問答（Go Play）", desc: "4 選項快問快答　6 題　答對撞磚加分", file: "mario-fraction-p5.html", tag: "數學 5" },
  { title: "第五課　地球生病了", desc: "荒漠化治理　拉動對比 ＋ 5 題互動遊戲", file: "renwen-p4-l5-desertification.html", tag: "人文 4" },
  { title: "部署測試頁", desc: "確認 Pages 運作正常", file: "demo.html", tag: "測試" },
];

const list = document.getElementById('list');
const hero = document.getElementById('hero');
const pad = n => String(n + 1).padStart(2, '0');

if (ACTIVITIES.length === 0) {
  list.innerHTML = '<li class="empty">仲未有活動。<br>將 HTML 檔放入資料夾，再喺 <code>index.html</code> 嘅 <code>ACTIVITIES</code> 加一行。</li>';
} else {
  /* 第一張：封面式大卡 */
  const first = ACTIVITIES[0];
  hero.hidden = false;
  hero.href = encodeURI(first.file);
  hero.innerHTML = `
    <span class="kicker">今日推介</span>
    ${first.tag ? `<span class="tag">${first.tag}</span>` : ''}
    <b>${first.title}</b>
    ${first.desc ? `<i>${first.desc}</i>` : ''}
    <span class="go">開始 <span aria-hidden="true">→</span></span>
    <span class="ring"></span>
    <span class="wm" aria-hidden="true">01</span>
  `;

  /* 其餘：編號清單（由 02 開始） */
  list.innerHTML = ACTIVITIES.slice(1).map((a, i) => `
    <li>
      <a href="${encodeURI(a.file)}">
        <span class="no">${pad(i + 1)}</span>
        <span class="body">
          <b>${a.title}</b>
          ${a.desc ? `<span>${a.desc}</span>` : ''}
        </span>
        ${a.tag ? `<span class="tag">${a.tag}</span>` : ''}
      </a>
    </li>
  `).join('');
}

document.getElementById('sub').textContent =
  ACTIVITIES.length ? `共 ${ACTIVITIES.length} 個活動` : '請選擇活動';
</script>

</body>
</html>
