<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2A8740">
<title>課堂活動</title>
<style>
  :root{
    --green:#2A8740;
    --ink:#1c1c1e;
    --muted:#6b7280;
    --line:#e5e7eb;
    --card:#ffffff;
    --bg:#f5f7f6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei","Noto Sans TC",sans-serif;
    background:var(--bg);color:var(--ink);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-text-size-adjust:100%;
  }
  header{
    background:var(--green);color:#fff;
    padding:22px 20px 26px;
  }
  header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.5px}
  header p{margin:6px 0 0;font-size:14px;opacity:.85}
  main{padding:18px 16px 48px;max-width:760px;margin:0 auto}
  .grid{display:grid;gap:14px}
  a.card{
    display:flex;align-items:center;gap:14px;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px 18px;text-decoration:none;color:inherit;
    min-height:76px;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  a.card:active{transform:scale(.985);box-shadow:none}
  .ico{
    flex:0 0 46px;height:46px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;background:#eaf4ec;
  }
  .txt{flex:1;min-width:0}
  .txt b{display:block;font-size:17px;font-weight:600;line-height:1.35}
  .txt span{display:block;font-size:13px;color:var(--muted);margin-top:3px;line-height:1.4}
  .arrow{flex:0 0 auto;color:#c4c9cf;font-size:20px}
  footer{
    text-align:center;font-size:12px;color:var(--muted);
    padding:28px 20px 34px;
  }
  .empty{
    background:var(--card);border:1px dashed var(--line);border-radius:16px;
    padding:28px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7;
  }
  @media (prefers-color-scheme: dark){
    :root{--ink:#f2f2f7;--muted:#9ca3af;--line:#2c2c2e;--card:#1c1c1e;--bg:#0f0f10}
    .ico{background:#25352a}
  }
</style>
</head>
<body>

<header>
  <h1>課堂活動</h1>
  <p id="sub">請選擇活動</p>
</header>

<main>
  <div class="grid" id="list"></div>
</main>

<footer>鳳溪第一小學 · 科創</footer>

<script>
/* ============================================================
   加活動只需要改下面呢個陣列：
   { title: 標題, desc: 一句說明, file: 檔案名, icon: emoji }
   file 放喺同一個資料夾，push 上去就生效。
   ============================================================ */
const ACTIVITIES = [
  { title: "人文4 第五課｜荒漠化治理", desc: "四年級 · 拉動對比 + 5 題互動遊戲", file: "renwen-p4-l5-desertification.html", icon: "🌱" },
  { title: "範例頁面", desc: "測試用 · 確認部署成功", file: "demo.html", icon: "✅" },
];

const list = document.getElementById('list');

if (ACTIVITIES.length === 0) {
  list.innerHTML = '<div class="empty">仲未有活動。<br>將 HTML 檔放入資料夾，再喺 <code>index.html</code> 嘅 <code>ACTIVITIES</code> 加一行。</div>';
} else {
  list.innerHTML = ACTIVITIES.map(a => `
    <a class="card" href="${encodeURI(a.file)}">
      <div class="ico">${a.icon || '📄'}</div>
      <div class="txt">
        <b>${a.title}</b>
        ${a.desc ? `<span>${a.desc}</span>` : ''}
      </div>
      <div class="arrow">›</div>
    </a>
  `).join('');
}

document.getElementById('sub').textContent =
  ACTIVITIES.length ? `${ACTIVITIES.length} 個活動` : '請選擇活動';
</script>

</body>
</html>
