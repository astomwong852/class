<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101309">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>村落爭霸｜本地單機</title>
<style>
  :root{
    --bg:#0f1209; --panel:#161a10; --panel2:#1d2216; --line:#2e3524;
    --ink:#e9e3d0; --dim:#8d9578; --clay:#c9714b; --leaf:#8fae5c;
    --wood:#7f9d51; --brick:#b46a48; --iron:#93a0a9; --crop:#b3a05c;
    --radius:13px;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 420px at 50% -160px, #1e2617 0%, transparent 70%),
      linear-gradient(180deg,#0f1209 0%,#0c0f07 100%);
    background-attachment:fixed;
    color:var(--ink); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    font-size:14px; line-height:1.55; -webkit-text-size-adjust:100%;
  }
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px);
    mix-blend-mode:screen;
  }
  h1,h2,h3,p{margin:0}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  svg{display:block}
  .ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;
       stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

  /* ---------- 頂部資源列 ---------- */
  .top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,rgba(19,24,13,.97),rgba(15,18,9,.92));
       border-bottom:1px solid var(--line);backdrop-filter:blur(10px);
       padding-top:env(safe-area-inset-top)}
  .top-in{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 14px}
  .brand{display:flex;align-items:baseline;gap:7px;white-space:nowrap}
  .brand b{font-size:15.5px;letter-spacing:.02em;font-weight:700}
  .brand span{font-size:9.5px;letter-spacing:.16em;color:var(--dim);
              border:1px solid var(--line);padding:1px 5px;border-radius:3px}
  .resbar{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;flex:1;min-width:0}
  @media(min-width:900px){.resbar{max-width:640px}}
  .res{display:flex;align-items:center;gap:7px;background:#0b0e07;border:1px solid var(--line);
       border-radius:9px;padding:5px 8px;min-width:0}
  .res .ico{width:18px;height:18px;color:var(--rc)}
  .res .num{font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:.01em;white-space:nowrap}
  .res .num small{color:var(--dim);font-size:10.5px;margin-left:2px}
  .res .meter{height:2px;background:#232a1a;border-radius:2px;margin-top:3px;overflow:hidden}
  .res .meter i{display:block;height:100%;background:var(--rc);opacity:.75;width:0;transition:width .3s linear}
  .hud{display:flex;gap:14px;font-size:11px;color:var(--dim);white-space:nowrap}
  .hud b{color:var(--ink);font-variant-numeric:tabular-nums}
  @media(max-width:720px){ .hud{display:none} .brand span{display:none} }
  @media(max-width:560px){
    .top-in{gap:8px;padding:7px 10px}
    .brand b{font-size:14px}
    .resbar{gap:5px}
    .res{gap:5px;padding:4px 6px}
    .res .ico{width:15px;height:15px}
    .res .num{font-size:11.5px}
    .res .num small{display:none}
  }

  /* ---------- 版面 ---------- */
  .shell{position:relative;z-index:1;max-width:1140px;margin:0 auto;padding:14px 14px 150px;
         display:grid;grid-template-columns:186px minmax(0,1fr);gap:14px}
  @media(max-width:860px){
    .shell{grid-template-columns:minmax(0,1fr);padding:12px 12px 168px}
  }
  nav.tabs{display:flex;flex-direction:column;gap:6px;align-self:start;position:sticky;top:64px}
  nav.tabs button{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:10px;
      border:1px solid transparent;color:var(--dim);text-align:left;font-size:13.5px;
      transition:background .12s var(--ease),color .12s var(--ease)}
  nav.tabs button .ico{width:18px;height:18px}
  nav.tabs button.on{background:var(--panel2);border-color:var(--line);color:var(--ink)}
  nav.tabs button:active{background:#232a1a}
  @media(max-width:860px){
    nav.tabs{position:fixed;top:auto;left:0;right:0;bottom:0;flex-direction:row;gap:0;z-index:28;
      background:rgba(15,18,9,.97);border-top:1px solid var(--line);backdrop-filter:blur(12px);
      padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
    nav.tabs button{flex:1;flex-direction:column;gap:2px;font-size:10.5px;padding:6px 2px;border:0;border-radius:8px}
    nav.tabs button .ico{width:20px;height:20px}
  }

  .stage{min-width:0}
  .panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
         border-radius:var(--radius);padding:14px}
  .panel + .panel{margin-top:12px}
  .ph{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:11px;flex-wrap:wrap}
  .ph h2{font-size:17px;font-weight:700;letter-spacing:.01em}
  .ph .sub{font-size:11.5px;color:var(--dim)}
  .hint{display:flex;gap:8px;align-items:flex-start;background:#12170d;border:1px dashed var(--line);
        border-radius:10px;padding:9px 11px;font-size:12px;color:var(--dim);margin-bottom:12px}
  .hint b{color:var(--ink);font-weight:600}

  /* ---------- 村莊卡 ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:9px}
  .bcard{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;
    background:linear-gradient(180deg,#202618,#171c11);border:1px solid var(--line);
    border-radius:11px;padding:11px 11px 10px;overflow:hidden;
    transition:transform .12s var(--ease),border-color .12s var(--ease)}
  .bcard:hover{transform:translateY(-1px);border-color:#46512f}
  .bcard:active{transform:scale(.99)}
  .bcard .top-row{display:flex;align-items:center;gap:7px;color:var(--acc,var(--ink))}
  .bcard .nm{font-size:13px;font-weight:600;color:var(--ink)}
  .bcard .lv{margin-left:auto;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;
             border:1px solid var(--line);border-radius:20px;padding:0 6px}
  .bcard .ln{font-size:11.5px;color:var(--dim);min-height:17px}
  .bcard .ln b{color:var(--ink);font-weight:600}
  .bcard.locked{opacity:.5}
  .bcard.busy{border-color:var(--clay)}
  .bcard .prog{position:absolute;left:0;bottom:0;height:2px;background:#0b0e07;width:100%}
  .bcard .prog i{display:block;height:100%;background:var(--clay);width:0}

  /* ---------- 地圖 ---------- */
  .mapwrap{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:520px;margin:0 auto}
  .tile{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:#12160d;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
        color:var(--dim);font-size:9.5px;padding:2px;transition:border-color .12s,background .12s}
  .tile .ico{width:19px;height:19px}
  .tile.t1{color:#a9c47e;background:#141a0f;border-color:#37432a}
  .tile.t2{color:#d9a45f;background:#191610;border-color:#493a24}
  .tile.t3{color:#d06a4a;background:#1c1310;border-color:#4c2c22}
  .tile.home{background:#1d2414;border-color:var(--leaf);color:var(--leaf)}
  .tile.empty{opacity:.35}
  .tile:active{background:#1b2113}
  .tile small{font-size:8.5px;opacity:.75}
  .legend{display:flex;gap:12px;justify-content:center;font-size:11px;color:var(--dim);margin-top:10px;flex-wrap:wrap}
  .legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}

  /* ---------- 兵營 ---------- */
  .unit{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;
        padding:11px;border:1px solid var(--line);border-radius:11px;background:#12170d}
  .unit + .unit{margin-top:9px}
  .unit .ic{width:38px;height:38px;border-radius:9px;background:#1c2214;display:grid;place-items:center;color:var(--clay)}
  .unit .ic .ico{width:22px;height:22px}
  .unit .nm{font-size:13.5px;font-weight:600}
  .unit .st{font-size:11px;color:var(--dim);margin-top:1px}
  .unit .own{font-size:11.5px;color:var(--leaf);font-variant-numeric:tabular-nums}
  .btnrow{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .btn{background:#242c19;border:1px solid #3a4429;border-radius:8px;padding:5px 10px;font-size:12px;
       transition:background .12s}
  .btn:hover{background:#2c3520}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--clay);border-color:#d5825c;color:#fff6ef;font-weight:600}
  .btn.primary:hover{background:#d17b53}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  /* ---------- 戰報 ---------- */
  .rep{border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#12170d}
  .rep + .rep{margin-top:8px}
  .rep .rh{display:flex;align-items:center;gap:8px;font-size:13px}
  .rep .win{font-size:10px;letter-spacing:.08em;padding:1px 6px;border-radius:4px;
            background:#26301a;color:var(--leaf);border:1px solid #3a4a26}
  .rep .lose{background:#2d1912;color:#d98a6d;border-color:#4a2a1e}
  .rep .rt{font-size:10.5px;color:var(--dim);margin-left:auto}
  .rep .rb{font-size:11.5px;color:var(--dim);margin-top:6px;line-height:1.7}
  .rep .rb b{color:var(--ink)}
  .empty{color:var(--dim);font-size:12.5px;padding:18px 4px;text-align:center;line-height:1.9}
  .feed{display:flex;flex-direction:column}
  .fi{display:flex;gap:10px;font-size:12.5px;padding:7px 0;border-bottom:1px solid #232a19;color:var(--ink)}
  .fi:last-child{border-bottom:0}
  .fi .ft{color:var(--dim);font-variant-numeric:tabular-nums;font-size:11px;min-width:38px}

  /* ---------- 底部隊列 ---------- */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:26;border-top:1px solid var(--line);
        background:linear-gradient(180deg,rgba(19,24,13,.95),rgba(12,15,7,.98));
        backdrop-filter:blur(10px);padding:7px 12px calc(7px + env(safe-area-inset-bottom))}
  @media(max-width:860px){ .dock{bottom:62px;padding-bottom:7px} }
  .dock-in{max-width:1140px;margin:0 auto;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
  .dock-in::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:#12170d;
        border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:11.5px;max-width:250px}
  .chip .ico{width:15px;height:15px;color:var(--clay)}
  .chip .cp{position:relative;height:2px;background:#242c19;border-radius:2px;margin-top:4px;width:120px;overflow:hidden}
  .chip .cp i{display:block;height:100%;background:var(--leaf);width:0}
  .chip .tm{color:var(--dim);font-variant-numeric:tabular-nums}
  .chip.done{border-color:var(--leaf)}
  .dock .idle{font-size:11.5px;color:var(--dim);padding:4px 2px}

  /* ---------- Modal ---------- */
  .modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:18px}
  .modal.hidden{display:none}
  .modal .bg{position:absolute;inset:0;background:rgba(6,8,4,.72);backdrop-filter:blur(3px)}
  .card{position:relative;width:100%;max-width:420px;background:linear-gradient(180deg,#222a19,#171c11);
        border:1px solid #3d472a;border-radius:16px;padding:17px;box-shadow:0 24px 60px rgba(0,0,0,.55);
        animation:pop .18s var(--ease)}
  @keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .card h3{font-size:17px;display:flex;align-items:center;gap:8px}
  .card h3 .ico{color:var(--clay)}
  .card .desc{font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.65}
  .kv{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px solid #2a3120}
  .kv:last-child{border-bottom:0}
  .kv span{color:var(--dim)}
  .cost{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:10px 0 4px}
  .cost .ci{display:flex;align-items:center;gap:6px;font-size:12.5px;font-variant-numeric:tabular-nums}
  .cost .ci .ico{width:16px;height:16px;color:var(--rc)}
  .cost .ci.no{color:#d98a6d}
  .card .foot{display:flex;gap:8px;margin-top:14px}
  .card .foot .btn{flex:1;text-align:center;padding:9px}
  .close{position:absolute;top:12px;right:12px;color:var(--dim);font-size:18px;line-height:1;padding:4px}
  .inp{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;
       background:#0e1208;padding:6px 9px;margin-top:7px}
  .inp label{font-size:12px;color:var(--dim);flex:1}
  .inp input{width:66px;background:#171d10;border:1px solid #333d25;border-radius:6px;color:var(--ink);
             padding:4px 6px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
  .inp .own{font-size:10.5px;color:var(--dim);min-width:44px;text-align:right}

  /* ---------- Toast ---------- */
  #toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,10px);z-index:80;
         background:#242c19;border:1px solid #3f4a2c;color:var(--ink);padding:9px 15px;border-radius:9px;
         font-size:12.5px;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;max-width:86vw}
  #toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>村落爭霸</b><span>LOCAL</span></div>
    <div class="resbar" id="resbar"></div>
    <div class="hud" id="hud"></div>
  </div>
</header>

<div class="shell">
  <nav class="tabs" id="tabs"></nav>
  <main class="stage" id="stage"></main>
</div>

<div class="dock"><div class="dock-in" id="dock"></div></div>

<div class="modal hidden" id="modal">
  <div class="bg" data-act="close"></div>
  <div class="card" id="modal-card"></div>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   村落爭霸 — 本地單機（Travian 風格）
   純前端、零外部依賴、localStorage 存檔、離線收益
   ============================================================ */

/* ---------------- 圖示 ---------------- */
const SVG = (d, extra='') => `<svg class="ico" viewBox="0 0 24 24" ${extra}>${d}</svg>`;
const ICON = {
  tree:   SVG('<path d="M12 3 5.5 13.5h13L12 3Z"/><path d="M12 13.5V21"/><path d="M9 21h6"/>'),
  brick:  SVG('<rect x="3" y="6" width="8" height="4.5" rx=".6"/><rect x="13" y="6" width="8" height="4.5" rx=".6"/><rect x="3" y="13" width="5" height="4.5" rx=".6"/><rect x="10" y="13" width="8" height="4.5" rx=".6"/>'),
  pick:   SVG('<path d="M3 21l7.5-7.5"/><path d="M6 4c5 1 9.5 5 11 11l-3.5 3.5C12 12 8.5 8 5.5 6.5"/>'),
  wheat:  SVG('<path d="M12 21V7.5"/><path d="M12 11c0-2.3 1.3-4.3 3.6-5.4-.6 2.9-1.6 4.8-3.6 5.4Z"/><path d="M12 11c0-2.3-1.3-4.3-3.6-5.4.6 2.9 1.6 4.8 3.6 5.4Z"/><path d="M12 16c0-2.3 1.3-4.3 3.6-5.4-.6 2.9-1.6 4.8-3.6 5.4Z"/><path d="M12 16c0-2.3-1.3-4.3-3.6-5.4.6 2.9 1.6 4.8 3.6 5.4Z"/>'),
  crate:  SVG('<rect x="3.5" y="6" width="17" height="13" rx="1"/><path d="M3.5 10.5h17"/><path d="M9 10.5V19M15 10.5V19"/>'),
  barn:   SVG('<path d="M4 20V11l8-6 8 6v9Z"/><rect x="10" y="14" width="4" height="6" rx=".6"/>'),
  tower:  SVG('<path d="M6 21V9l6-5 6 5v12Z"/><path d="M10.5 21v-5.5h3V21"/><path d="M9.5 9.5h5"/>'),
  sword:  SVG('<path d="M5 19 19 5"/><path d="M14 5h5v5"/><path d="M4.5 20.5 8 17"/><path d="M6.5 15.5l2 2"/>'),
  axe:    SVG('<path d="M11 21V9"/><path d="M11 9C7.7 9 5 6.9 4 3c3.6.3 6.4 1.8 7 4.7"/><path d="M11 9c3.3 0 6-2.1 7-6-3.6.3-6.4 1.8-7 4.7"/>'),
  shield: SVG('<path d="M12 3l7 3v5.2c0 4.9-3 8.1-7 9.8-4-1.7-7-4.9-7-9.8V6Z"/><path d="M12 8v7"/>'),
  flag:   SVG('<path d="M6 21V4"/><path d="M6 5h12l-3.2 4L18 13H6"/>'),
  anvil:  SVG('<path d="M3.5 9h9a5 5 0 0 0 5 5h3v3H8"/><path d="M7 20.5h9"/><path d="M8 17v3.5"/>'),
  map:    SVG('<path d="M3 7l6-2.5 6 2.5 6-2.5v12L15 19l-6-2.5L3 19Z"/><path d="M9 4.5v12M15 7v12"/>'),
  village:SVG('<path d="M3 20V11l4.5-3.5L12 11v9Z"/><path d="M12 20V13l4-3 4 3v7Z"/><path d="M6.5 20v-4h3v4"/>'),
  report: SVG('<path d="M6 3h9l4 4v14H6Z"/><path d="M9 12h7M9 16h5M15 3v4h4"/>'),
  home:   SVG('<path d="M4 20V10l8-6 8 6v10Z"/><path d="M10 20v-6h4v6"/>')
};

/* ---------------- 常數 ---------------- */
const SAVE = 'fk1ps_village_v1';
const RES = ['wood','clay','iron','crop'];
const RM = {
  wood:{n:'木材', v:'--wood', ic:'tree'},
  clay:{n:'磚',   v:'--brick', ic:'brick'},
  iron:{n:'鐵',   v:'--iron', ic:'pick'},
  crop:{n:'穀物', v:'--crop', ic:'wheat'}
};
const MAXLV = 20;

const B = {
  woodcutter:{n:'伐木場', ic:'tree', prod:'wood', base:{wood:40,clay:30,iron:20,crop:10}, t:18},
  claypit:  {n:'泥坑',   ic:'brick',prod:'clay', base:{wood:30,clay:45,iron:20,crop:10}, t:20},
  ironmine: {n:'鐵礦場', ic:'pick', prod:'iron', base:{wood:35,clay:30,iron:45,crop:15}, t:26},
  cropland: {n:'農田',   ic:'wheat',prod:'crop', base:{wood:25,clay:25,iron:15,crop:35}, t:20},
  warehouse:{n:'倉庫', ic:'crate', base:{wood:80,clay:60,iron:40,crop:20}, t:30},
  granary:  {n:'穀倉', ic:'barn',  base:{wood:80,clay:50,iron:30,crop:40}, t:30},
  main:     {n:'村莊大樓', ic:'tower', base:{wood:120,clay:100,iron:80,crop:60}, t:45},
  barracks: {n:'兵營', ic:'sword', base:{wood:150,clay:140,iron:120,crop:80}, t:60, req:{main:3}},
  rally:    {n:'集結點', ic:'flag', base:{wood:110,clay:160,iron:90,crop:70}, t:40, req:{main:2}},
  smithy:   {n:'鐵匠鋪', ic:'anvil',base:{wood:160,clay:130,iron:150,crop:60}, t:55, req:{main:3}}
};
const ORDER = ['woodcutter','claypit','ironmine','cropland','warehouse','granary','main','barracks','rally','smithy'];
const RESKEY = {wood:'woodcutter',clay:'claypit',iron:'ironmine',crop:'cropland'};

const U = {
  club: {n:'棍棒兵', ic:'sword', atk:40, cap:60,  t:12, spd:1,   cost:{wood:95,clay:75,iron:40,crop:40}},
  axe:  {n:'斧兵',   ic:'axe',    atk:75, cap:100, t:30, spd:.8, cost:{wood:130,clay:120,iron:180,crop:70}},
  scout:{n:'斥候',   ic:'map',    atk:20, cap:30,  t:18, spd:2.5,cost:{wood:110,clay:80,iron:70,crop:60}}
};
const UORDER = ['club','axe','scout'];

/* ---------------- 工具 ---------------- */
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const sum = o => Object.values(o).reduce((a,b)=>a+b,0);
function fmt(n){
  n = Math.floor(n);
  return n >= 10000 ? (n/1000).toFixed(1).replace(/\.0$/,'')+'k' : n.toLocaleString('en-US');
}
function tstr(ms){
  ms = Math.max(0, ms);
  const s = Math.ceil(ms/1000);
  if (s < 60) return s + '秒';
  const m = Math.floor(s/60), ss = s%60;
  return m + '分' + (ss ? ss+'秒' : '');
}
function clock(ts){
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 1900);
}
function addLog(txt){
  state.log.unshift({t: Date.now(), x: txt});
  if (state.log.length > 30) state.log.length = 30;
}

/* ---------------- 狀態 ---------------- */
let state = null;
let dirty = true;
let modal = null;   // {type:'b', key} | {type:'t', id}

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const TILE_NAMES = ['山賊營地','荒廢村落','流亡者寨','盜匪巢穴','野狼谷','枯井村','黑石崗','斷橋營',
                    '沙丘哨站','舊礦坑','燒焦農莊','河谷寨','霧林營','亂石堡','禿鷹巢','荒廟'];

function makeMap(){
  const rnd = mulberry32(20261120);
  const spots = [];
  for (let y=0;y<7;y++) for (let x=0;x<7;x++){
    if (x===3 && y===3) continue;
    spots.push([x,y]);
  }
  // 洗牌
  for (let i=spots.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [spots[i],spots[j]] = [spots[j],spots[i]]; }
  const picks = spots.slice(0,17);
  const tierDef = {1:90, 2:270, 3:640};
  const tierLoot = {1:900, 2:2100, 3:4200};
  const tiles = [];
  for (let y=0;y<7;y++) for (let x=0;x<7;x++){
    tiles.push({id:y*7+x, x, y, type:'empty', name:'', tier:0, def:0, loot:{wood:0,clay:0,iron:0,crop:0}, max:{wood:0,clay:0,iron:0,crop:0}});
  }
  picks.forEach((p, i) => {
    const dist = Math.max(Math.abs(p[0]-3), Math.abs(p[1]-3));
    const tier = dist <= 1 ? 1 : dist <= 2 ? 2 : 3;
    const tile = tiles[p[1]*7 + p[0]];
    tile.type = 'village';
    tile.tier = tier;
    tile.name = TILE_NAMES[i % TILE_NAMES.length];
    tile.def = Math.round(tierDef[tier] * (0.9 + rnd()*0.25));
    const total = Math.round(tierLoot[tier] * (0.9 + rnd()*0.25));
    const w = [0.4+rnd()*0.5, 0.4+rnd()*0.5, 0.3+rnd()*0.5, 0.4+rnd()*0.5];
    const sw = w[0]+w[1]+w[2]+w[3];
    RES.forEach((r,idx) => { const v = Math.round(total*w[idx]/sw); tile.max[r] = v; tile.loot[r] = v; });
  });
  return tiles;
}

function newState(){
  return {
    v: 1,
    name: '鳳溪村',
    tab: 'village',
    res: {wood:420, clay:420, iron:300, crop:360},
    lv: {woodcutter:1, claypit:1, ironmine:1, cropland:1, warehouse:1, granary:1,
         main:1, barracks:0, rally:0, smithy:0},
    build: null,
    train: [],
    troops: {club:0, axe:0, scout:0},
    armies: [],
    reports: [],
    seq: 1,
    t: Date.now(),
    log: [{t: Date.now(), x: '村莊建立，開始發展。'}],
    map: makeMap()
  };
}

function save(){ try{ localStorage.setItem(SAVE, JSON.stringify(state)); }catch(e){} }

function load(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(SAVE) || 'null'); }catch(e){ s = null; }
  if (!s || s.v !== 1 || !s.lv || !s.map) { state = newState(); return; }
  const base = newState();
  state = Object.assign(base, s);
  state.res = Object.assign(base.res, s.res || {});
  state.lv = Object.assign(base.lv, s.lv || {});
  state.troops = Object.assign(base.troops, s.troops || {});
  state.build = s.build || null;
  state.train = Array.isArray(s.train) ? s.train : [];
  state.armies = Array.isArray(s.armies) ? s.armies : [];
  state.reports = Array.isArray(s.reports) ? s.reports : [];
  state.log = Array.isArray(s.log) && s.log.length ? s.log : base.log;
  offlineCatchup();
}

/* ---------------- 數值 ---------------- */
const capW = () => Math.round(800 * Math.pow(1.42, state.lv.warehouse - 1));
const capG = () => Math.round(800 * Math.pow(1.42, state.lv.granary - 1));
const capOf = r => r === 'crop' ? capG() : capW();

const prodMin = r => {
  const lv = state.lv[RESKEY[r]] || 0;
  return lv ? 6 * Math.pow(1.27, lv - 1) : 0;
};
const upkeep = () => sum(state.troops) * 1;   // 每兵每分鐘食 1 穀物

function upgradeCost(key, target){
  const d = B[key], m = Math.pow(1.30, target - 2), c = {};
  RES.forEach(r => c[r] = Math.round((d.base[r] || 0) * m));
  return c;
}
function upgradeTime(key, target){
  let s = B[key].t * Math.pow(1.32, target - 2);
  s *= 1 - 0.02 * (state.lv.main - 1);
  return Math.max(5, Math.round(s));
}
function lockedBy(key){
  const req = B[key].req; if (!req) return null;
  for (const k in req) if (state.lv[k] < req[k]) return `需要 ${B[k].n} Lv.${req[k]}`;
  return null;
}
function afford(c){ return RES.every(r => state.res[r] >= (c[r] || 0) - 0.001); }
function pay(c){ RES.forEach(r => state.res[r] = Math.max(0, state.res[r] - (c[r] || 0))); }
function costLeft(c){ return RES.reduce((s,r)=> s + Math.max(0, (c[r]||0) - state.res[r]), 0); }

const atkOf = u => Object.keys(u).reduce((s,k)=> s + (u[k]||0) * U[k].atk, 0);
const speedOf = u => Math.min(...Object.keys(u).filter(k=>u[k]>0).map(k=>U[k].spd), 99);

/* ---------------- 動作 ---------------- */
function startBuild(key){
  if (state.build) return toast('工人正在忙，等佢做完先');
  const target = state.lv[key] + 1;
  if (target > MAXLV) return toast('已經最高等級');
  const lock = lockedBy(key); if (lock) return toast(lock);
  const c = upgradeCost(key, target);
  if (!afford(c)) return toast('資源不足');
  pay(c);
  const sec = upgradeTime(key, target);
  state.build = {key, target, start: Date.now(), end: Date.now() + sec*1000};
  addLog(`${B[key].n} 開始升級至 Lv.${target}`);
  dirty = true; closeModal(); save(); paint(); toast(`${B[key].n} 開始升級（${tstr(sec*1000)}）`);
}

function train(unit, n){
  if (state.lv.barracks < 1) return toast('要先起兵營（需村莊大樓 Lv.3）');
  const d = U[unit], total = {};
  RES.forEach(r => total[r] = (d.cost[r] || 0) * n);
  if (!afford(total)) return toast('資源不足');
  pay(total);
  const spd = 1 + 0.12 * state.lv.barracks;
  const dur = Math.max(2, d.t / spd) * 1000;
  let t = state.train.length ? state.train[state.train.length - 1].end : Date.now();
  for (let i=0;i<n;i++){ t += dur; state.train.push({u:unit, end:t}); }
  addLog(`兵營開始訓練 ${n} 名${d.n}`);
  dirty = true; save(); paint(); toast(`訓練 ${n} 名${d.n}`);
}

function dispatch(tileId){
  if (state.lv.rally < 1) return toast('要先起集結點（需村莊大樓 Lv.2）');
  const u = {}; let any = false;
  document.querySelectorAll('#modal-card [data-u]').forEach(inp => {
    let n = Math.floor(Number(inp.value) || 0);
    const k = inp.dataset.u;
    if (n > 0){ n = Math.min(n, state.troops[k]); u[k] = n; any = true; }
  });
  if (!any) return toast('未揀部隊');
  const tile = state.map.find(t => t.id === tileId);
  if (!tile || tile.type !== 'village') return toast('目標無效');
  const dist = Math.max(Math.abs(tile.x - 3), Math.abs(tile.y - 3));
  const travel = Math.max(6, Math.round(dist * 9 / speedOf(u))) * 1000;
  for (const k in u) state.troops[k] -= u[k];
  state.armies.push({id: state.seq++, tile: tileId, u, at: Date.now() + travel, travel, phase:'out', loot:null});
  addLog(`部隊出發前往 ${tile.name}`);
  dirty = true; closeModal(); save(); paint();
  toast(`部隊出發，${tstr(travel)} 後抵達`);
}

function resolveBattle(a){
  const t = state.map.find(x => x.id === a.tile);
  const power = Math.round(atkOf(a.u) * (1 + 0.05 * state.lv.smithy));
  const win = power > t.def;
  const lf = win ? clamp(0.08 + 0.42 * (t.def / Math.max(1, power)), 0.08, 0.85) : 1;
  let gone = 0; const back = {};
  for (const k in a.u){
    const n = a.u[k];
    const lost = Math.min(n, Math.round(n * lf));
    back[k] = n - lost; gone += lost;
  }
  const loot = {wood:0, clay:0, iron:0, crop:0};
  if (win){
    const cap = Object.keys(back).reduce((s,k)=> s + back[k] * U[k].cap, 0);
    const avail = sum(t.loot);
    const take = Math.min(cap, avail);
    if (avail > 0 && take > 0){
      RES.forEach(r => { loot[r] = Math.floor(take * t.loot[r] / avail); t.loot[r] -= loot[r]; });
    }
  }
  a.u = back; a.loot = loot; a.phase = 'back'; a.at = a.at + a.travel;
  addLog(win ? `攻下 ${t.name}，帶回資源` : `進攻 ${t.name} 失敗，全軍覆沒`);
  state.reports.unshift({
    t: Date.now(), name: t.name, x: t.x, y: t.y, win,
    power, def: t.def, gone, back: Object.assign({}, back), loot
  });
  if (state.reports.length > 40) state.reports.pop();
  dirty = true;
}

/* ---------------- 模擬 ---------------- */
function tick(){
  const now = Date.now();
  let dt = (now - state.t) / 1000;
  if (!(dt > 0)) dt = 0;
  state.t = now;

  if (dt > 0){
    // 資源
    const up = upkeep();
    RES.forEach(r => {
      let g = prodMin(r) / 60 * dt;
      if (r === 'crop') g -= up / 60 * dt;
      state.res[r] = clamp(state.res[r] + g, 0, capOf(r));
    });
    // 敵村補給
    const regen = dt / 600;
    state.map.forEach(t => {
      if (t.type !== 'village') return;
      RES.forEach(r => { t.loot[r] = Math.min(t.max[r], t.loot[r] + t.max[r] * regen); });
    });
    // 建造
    if (state.build && state.build.end <= now){
      const {key, target} = state.build;
      state.lv[key] = target;
      state.build = null; dirty = true;
      addLog(`${B[key].n} 完成升級至 Lv.${target}`);
      toast(`${B[key].n} 升至 Lv.${target}`);
    }
    // 訓練
    while (state.train.length && state.train[0].end <= now){
      const it = state.train.shift();
      state.troops[it.u] = (state.troops[it.u] || 0) + 1;
      dirty = true;
    }
    // 軍隊
    for (let i = state.armies.length - 1; i >= 0; i--){
      const a = state.armies[i];
      if (a.phase === 'out' && a.at <= now){ resolveBattle(a); }
      if (a.phase === 'back' && a.at <= now){
        for (const k in a.u) state.troops[k] = (state.troops[k] || 0) + a.u[k];
        RES.forEach(r => { if (a.loot[r]) state.res[r] = clamp(state.res[r] + a.loot[r], 0, capOf(r)); });
        state.armies.splice(i, 1);
        dirty = true;
      }
    }
  }
  paint();
}

function offlineCatchup(){
  const now = Date.now();
  let dt = (now - (state.t || now)) / 1000;
  if (!(dt > 5)) return;
  dt = Math.min(dt, 6 * 3600);        // 最多計 6 小時
  const up = upkeep();
  RES.forEach(r => {
    let g = prodMin(r) / 60 * dt;
    if (r === 'crop') g -= up / 60 * dt;
    state.res[r] = clamp(state.res[r] + g, 0, capOf(r));
  });
  if (state.build && state.build.end <= now){ state.lv[state.build.key] = state.build.target; state.build = null; }
  while (state.train.length && state.train[0].end <= now){
    const it = state.train.shift(); state.troops[it.u] = (state.troops[it.u] || 0) + 1;
  }
  for (let i = state.armies.length - 1; i >= 0; i--){
    const a = state.armies[i];
    if (a.phase === 'out' && a.at <= now) resolveBattle(a);
    if (a.phase === 'back' && a.at <= now){
      for (const k in a.u) state.troops[k] = (state.troops[k] || 0) + a.u[k];
      RES.forEach(r => { if (a.loot[r]) state.res[r] = clamp(state.res[r] + a.loot[r], 0, capOf(r)); });
      state.armies.splice(i, 1);
    }
  }
  state.t = now;
  dirty = true;
}

function buildTop(){
  $('#resbar').innerHTML = RES.map(r => `
    <div class="res" style="--rc:var(${RM[r].v})">
      ${ICON[RM[r].ic]}

        <div class="meter"><i id="r-${r}-m"></i></div>
      </div>
    </div>`).join('');
}

function paintTop(){
  RES.forEach(r => {
    const v = Math.floor(state.res[r]), cap = capOf(r);
    const n = document.getElementById('r-' + r);
    if (n) n.textContent = fmt(v) + ' / ' + fmt(cap);
    const p = document.getElementById('r-' + r + '-p');
    if (p){
      const net = prodMin(r) - (r === 'crop' ? upkeep() : 0);
      p.textContent = (net >= 0 ? '+' : '') + net.toFixed(0) + '/分';
    }
    const m = document.getElementById('r-' + r + '-m');
    if (m) m.style.width = Math.min(100, v / cap * 100) + '%';
  });
  const hud = $('#hud');
  if (hud){
    hud.innerHTML = `村莊 <b>${state.name}</b>　人口 <b>${sum(state.lv)}</b>　部隊 <b>${sum(state.troops)}</b>`;
  }
}

  {k:'village', n:'村莊', ic:'village'},
  {k:'map',     n:'地圖', ic:'map'},
  {k:'army',    n:'兵營', ic:'sword'},

];

function buildTabs(){

}

function stage(){
  if (state.tab === 'village') return viewVillage();
  if (state.tab === 'map') return viewMap();
  if (state.tab === 'army') return viewArmy();
  return viewReports();
}

function viewVillage(){
  const cards = ORDER.map(bcard).join('');
  const pop = sum(state.lv);
  return `
  <div class="panel">
    <div class="ph">
      <div><h2>${state.name}</h2>
        <div class="sub">人口 ${pop}　·　每分鐘收入　${RES.map(r=>{
          const net = prodMin(r) - (r==='crop'?upkeep():0);
          return `<b style="color:var(--${RM[r].v.slice(2)})">${net.toFixed(0)}</b> ${RM[r].n}`;
        }).join('　')}</div>
      </div>
    </div>
    ${pop <= 10 ? `<div class="hint">${ICON.tower}<div><b>起步：</b>先升四座資源場 → 村莊大樓 Lv.2 起集結點 → 出兵打近處村落搶資源。</div></div>` : ''}
    <div class="grid">${cards}</div>
  </div>

    <div class="feed">
      ${state.log.slice(0,6).map(l => `<div class="fi"><span class="ft">${clock(l.t)}</span><span>${l.x}</span></div>`).join('')}
    </div>

}

function bcard(key){
  const d = B[key], lv = state.lv[key], maxed = lv >= MAXLV;
  const lock = lockedBy(key);
  const busy = state.build && state.build.key === key;
  let line = '';
  if (d.prod) line = `+${fmt(prodMin(d.prod))} ${RM[d.prod].n} / 分`;
  else if (key === 'warehouse') line = `儲存上限 ${fmt(capW())}`;
  else if (key === 'granary') line = `儲存上限 ${fmt(capG())}`;
  else if (key === 'main') line = `建造時間 -${(lv-1)*2}%`;
  else if (key === 'barracks') line = lv ? `訓練速度 ×${(1+0.12*lv).toFixed(2)}` : '訓練部隊';
  else if (key === 'rally') line = lv ? '可以出兵掠奪' : '解鎖出兵';
  else if (key === 'smithy') line = `部隊攻擊 +${lv*5}%`;
  if (lock) line = lock;
  const acc = d.prod ? `--${RM[d.prod].v.slice(2)}` : 'var(--ink)';
  return `
  <button class="bcard ${lock?'locked':''} ${busy?'busy':''}" data-act="bld" data-k="${key}" style="--acc:${acc}">
    <span class="top-row">
      ${ICON[d.ic]}<span class="nm">${d.n}</span>
      <span class="lv">Lv.${lv}</span>
    </span>
    <span class="ln">${line}</span>
    ${busy ? `<span class="prog"><i id="bp-${key}"></i></span>` : ''}
    ${maxed ? `<span class="ln" style="color:var(--leaf)">已滿級</span>` : ''}
  </button>`;
}

function trainRows(){
  const now = Date.now();
  return state.train.slice(0, 12).map((it, i) => {
    const left = it.end - now;
    return `<div class="kv"><span>${U[it.u].n}</span>
      <span>${left > 0 ? tstr(left) : '完成中'}</span></div>`;
  }).join('') + (state.train.length > 12 ? `<div class="kv"><span>…</span><span>其餘 ${state.train.length-12} 名</span></div>` : '');
}

function viewReports(){
  if (!state.reports.length) return `<div class="panel"><div class="ph"><h2>戰報</h2></div>
    <div class="empty">仲未有戰報。<br>去地圖揀一個村落，出兵掠奪。</div></div>`;
  const rows = state.reports.map(r => `
    <div class="rep">
      <div class="rh">
        <span class="${r.win?'win':'lose'}">${r.win?'勝':'敗'}</span>
        <b>${r.name}</b> <span class="sub">(${r.x},${r.y})</span>
        <span class="rt">${clock(r.t)}</span>
      </div>
      <div class="rb">
        我方攻擊 <b>${fmt(r.power)}</b>　敵方防禦 <b>${fmt(r.def)}</b><br>
        損失 <b>${r.gone}</b> 名　帶回 ${RES.filter(x=>r.loot[x]>0).map(x=>`<b>${RM[x].n} ${fmt(r.loot[x])}</b>`).join('、') || '無'}
      </div>
    </div>`).join('');
  return `<div class="panel"><div class="ph"><h2>戰報</h2><span class="sub">最近 ${state.reports.length} 場</span></div>${rows}</div>`;
}

/* ---------------- 底部隊列 ---------------- */
function paintDock(){
  const now = Date.now();
  const chips = [];
  if (state.build){
    const b = state.build;
    const pct = clamp((now - b.start) / (b.end - b.start) * 100, 0, 100);
    chips.push(`<div class="chip">${ICON[B[b.key].ic]}
      <div style="min-width:0">
        <div>${B[b.key].n} → Lv.${b.target} <span class="tm" id="dq-build">${tstr(b.end-now)}</span></div>
        <div class="cp"><i id="dbp" style="width:${pct}%"></i></div>
      </div></div>`);
  }
  if (state.train.length){
    const it = state.train[0];
    const total = it.end - (state.train[1] ? 0 : it.end);
    chips.push(`<div class="chip">${ICON.sword}
      <div style="min-width:0">
        <div>訓練 ${U[it.u].n} <span class="tm" id="dq-train">${tstr(it.end-now)}</span></div>
        <div class="cp"><i id="dtp"></i></div>
      </div></div>`);
  }
  state.armies.forEach(a => {
    const t = state.map.find(x => x.id === a.tile);
    const label = a.phase === 'out' ? `出兵 ${t.name}` : `返程 ${t.name}`;
    const left = a.at - now;
    chips.push(`<div class="chip">${ICON[a.phase==='out'?'flag':'home']}
      <div style="min-width:0">
        <div>${label} <span class="tm">${left>0?tstr(left):'—'}</span></div>
        <div class="cp"><i style="width:${clamp(100-left/a.travel*100,0,100)}%"></i></div>
      </div></div>`);
  });
  $('#dock').innerHTML = chips.length ? chips.join('') : `<div class="idle">工人閒置 — 揀一座建築升級</div>`;
}

/* ---------------- Modal ---------------- */
function openBuilding(key){ modal = {type:'b', key}; renderModal(); }
function openTile(id){ modal = {type:'t', id}; renderModal(); }
function closeModal(){ modal = null; $('#modal').classList.add('hidden'); }

function modalCost(c){
  return `<div class="cost">${RES.map(r => `
    <div class="ci ${state.res[r] + 0.001 < (c[r]||0) ? 'no' : ''}" style="--rc:var(${RM[r].v})">
      ${ICON[RM[r].ic]}<span>${fmt(c[r]||0)}</span>
      <span style="color:var(--dim);font-size:10.5px">(${fmt(state.res[r])})</span>
    </div>`).join('')}</div>`;
}

function renderModal(){
  if (!modal) return;
  const card = $('#modal-card');
  if (modal.type === 'b'){
    const key = modal.key, d = B[key], lv = state.lv[key], target = lv + 1;
    const lock = lockedBy(key), maxed = lv >= MAXLV;
    const busy = !!state.build;
    const c = maxed ? {} : upgradeCost(key, target);
    const sec = maxed ? 0 : upgradeTime(key, target);
    let now = '', next = '';
    if (d.prod){ now = `每分鐘 +${prodMin(d.prod).toFixed(1)} ${RM[d.prod].n}`;
                 next = `每分鐘 +${(6*Math.pow(1.27,target-1)).toFixed(1)}`; }
    else if (key === 'warehouse'){ now = `上限 ${fmt(capW())}`; next = `上限 ${fmt(Math.round(800*Math.pow(1.42,target-1)))}`; }
    else if (key === 'granary'){ now = `上限 ${fmt(capG())}`; next = `上限 ${fmt(Math.round(800*Math.pow(1.42,target-1)))}`; }
    else if (key === 'main'){ now = `建造時間 -${(lv-1)*2}%`; next = `建造時間 -${(target-1)*2}%`; }
    else if (key === 'barracks'){ now = lv?`訓練 ×${(1+.12*lv).toFixed(2)}`:'未建造'; next = `訓練 ×${(1+.12*target).toFixed(2)}`; }
    else if (key === 'rally'){ now = lv?'已解鎖出兵':'未建造'; next = '解鎖出兵'; }
    else if (key === 'smithy'){ now = `攻擊 +${lv*5}%`; next = `攻擊 +${target*5}%`; }

    card.innerHTML = `
      <button class="close" data-act="close">✕</button>
      <h3>${ICON[d.ic]}${d.n} <span style="font-size:12px;color:var(--dim)">Lv.${lv}</span></h3>
      <div class="desc">${now}${maxed?'':'　→　'+next}</div>
      ${lock ? `<div class="desc" style="color:#d98a6d;margin-top:8px">${lock}</div>` : ''}
      ${state.build && state.build.key === key ? `
        <div class="kv" style="margin-top:10px"><span>升級進行中</span><span id="m-prog">${tstr(state.build.end-Date.now())}</span></div>` : ''}
      ${maxed ? '' : `
        <div class="kv" style="margin-top:10px"><span>升級至 Lv.${target}</span><span>需時 ${tstr(sec*1000)}</span></div>
        ${modalCost(c)}
        <div class="foot">
          <button class="btn primary" data-act="up" data-k="${key}"
            ${(lock || busy || !afford(c)) ? 'disabled' : ''}>
            ${busy && state.build.key !== key ? '工人忙碌中' : (lock ? '條件未達成' : (!afford(c) ? '資源不足' : '升級'))}
          </button>
        </div>`}
    `;
  } else {
    const t = state.map.find(x => x.id === modal.id);
    const dist = Math.max(Math.abs(t.x-3), Math.abs(t.y-3));
    const rows = UORDER.map(k => `
      <div class="inp">
        <label>${U[k].n}</label>
        <span class="own" id="own-${k}">有 ${state.troops[k]}</span>
        <input type="number" min="0" max="${state.troops[k]}" value="0" data-u="${k}">
      </div>`).join('');
    card.innerHTML = `
      <button class="close" data-act="close">✕</button>
      <h3>${ICON.flag}${t.name}</h3>
      <div class="desc">座標 (${t.x},${t.y})　距離 ${dist} 格　敵方防禦 <b style="color:#e0a184">${fmt(t.def)}</b></div>
      <div class="desc">可掠奪：${RES.map(r=>`${RM[r].n} ${fmt(t.loot[r])}`).join('　')}</div>
      <div class="kv" style="margin-top:10px"><span>我方可派出</span><span>${sum(state.troops)} 名</span></div>
      <div class="kv"><span>攻擊力合計</span><span id="m-atk">0</span></div>
      ${state.lv.rally ? '' : `<div class="desc" style="color:#d98a6d;margin-top:8px">要先起集結點才可以出兵。</div>`}
      <div style="margin-top:10px">${rows}</div>
      <div class="foot">
        <button class="btn" data-act="all" data-k="${t.id}">全選</button>
        <button class="btn primary" data-act="go" data-k="${t.id}" ${state.lv.rally?'':'disabled'}>出兵</button>
      </div>`;
  }
  $('#modal').classList.remove('hidden');
}

function modalDynamic(){
  if (!modal) return;
  if (modal.type === 'b' && state.build && state.build.key === modal.key){
    const p = document.getElementById('m-prog');
    if (p) p.textContent = tstr(state.build.end - Date.now());
  }
  if (modal.type === 't'){
    let power = 0;
    document.querySelectorAll('#modal-card [data-u]').forEach(inp => {
      const n = Math.floor(Number(inp.value) || 0);
      power += Math.max(0, Math.min(n, state.troops[inp.dataset.u])) * U[inp.dataset.u].atk;
    });
    power = Math.round(power * (1 + 0.05 * state.lv.smithy));
    const el = document.getElementById('m-atk');
    if (el) el.textContent = fmt(power);
  }
}

/* ---------------- 主繪製 ---------------- */
let lastStage = '';

function renderStage(){
  const html = stage();
  $('#stage').innerHTML = html;
  lastStage = state.tab;
}

function paint(){
  paintTop();
  paintDock();
  if (dirty || lastStage !== state.tab){
    buildTabs();
    renderStage();
    dirty = false;
  }
  // 建造卡進度條
  if (state.build){
    const b = state.build;
    const i = document.getElementById('bp-' + b.key);
    if (i) i.style.width = clamp((Date.now() - b.start) / (b.end - b.start) * 100, 0, 100) + '%';
  }
  modalDynamic();
}

/* ---------------- 互動 ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, k = el.dataset.k;
  if (act === 'tab'){ state.tab = k; dirty = true; paint(); }
  else if (act === 'bld') openBuilding(k);
  else if (act === 'up') startBuild(k);
  else if (act === 'close') closeModal();
  else if (act === 'tile') openTile(Number(k));
  else if (act === 'train') train(el.dataset.u, Number(el.dataset.n));
  else if (act === 'go') dispatch(Number(k));
  else if (act === 'all'){
    document.querySelectorAll('#modal-card [data-u]').forEach(inp => {
      inp.value = state.troops[inp.dataset.u];
    });
    modalDynamic();
  }
  else if (act === 'save'){ save(); toast('已存檔'); }
  else if (act === 'reset'){
    if (confirm('重新開始？現有進度會清除。')){ localStorage.removeItem(SAVE); state = newState(); dirty = true; buildTabs(); paint(); toast('新村落已建立'); }
  }
});

document.addEventListener('input', e => {
  if (e.target.matches('#modal-card [data-u]')) modalDynamic();
});

/* ---------------- 啟動 ---------------- */
load();
buildTop();
buildTabs();
paint();
setInterval(tick, 500);
setInterval(save, 4000);
window.addEventListener('beforeunload', save);
</script>
</body>
</html>
