<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>加入遊戲</title>
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/play.css">
</head>
<body class="play">

<!-- ══════════ 加入 ══════════ -->
<section class="screen active" id="scr-join">
  <div class="join-mark">
    <svg class="m0" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 22.4 20.4H1.6z"/></svg>
    <svg class="m1" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.8 22.2 12 12 22.2 1.8 12z"/></svg>
    <svg class="m2" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
    <svg class="m3" viewBox="0 0 24 24" fill="currentColor"><rect x="2.4" y="2.4" width="19.2" height="19.2" rx="4"/></svg>
  </div>
  <div class="join-eyebrow">Live Quiz</div>
  <h1 class="join-title">加入<br>遊戲</h1>
  <p class="join-sub">輸入大屏上面嘅 PIN 就得</p>

  <div class="field">
    <label for="input-pin">遊戲 PIN</label>
    <input id="input-pin" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off">
  </div>
  <div class="field">
    <label for="input-name">你嘅暱稱</label>
    <input id="input-name" maxlength="16" placeholder="例如：小明" autocomplete="nickname">
  </div>

  <button class="join-btn" id="btn-join" disabled>加入遊戲</button>
  <div class="join-err" id="join-err"></div>
</section>

<!-- ══════════ 等開始 ══════════ -->
<section class="screen" id="scr-lobby">
  <div class="avatar-big" id="lobby-avatar">?</div>
  <div class="lobby-name" id="lobby-name">—</div>
  <div class="lobby-status">
    等主持人開始
    <span class="lobby-dots"><i></i><i></i><i></i></span>
  </div>
  <div class="lobby-meta" id="lobby-meta">已經入到房，唔好閂咗個畫面</div>
</section>

<!-- ══════════ 答題 ══════════ -->
<section class="screen" id="scr-question">
  <div class="p-top">
    <div class="p-prog">第 <b id="p-num">1</b> / <span id="p-total">10</span> 題</div>
    <div class="p-score"><b id="p-score">0</b> 分</div>
  </div>
  <div class="p-timebar" id="p-timebar"><i id="p-timefill"></i></div>
  <div class="p-q" id="p-q"></div>
  <div class="p-opts" id="p-opts"></div>
</section>

<!-- ══════════ 已提交 ══════════ -->
<section class="screen" id="scr-wait">
  <div class="wait-block" id="wait-block"></div>
  <div class="wait-title">已提交</div>
  <div class="wait-sub">等大屏公佈答案…</div>
  <div class="wait-count" id="wait-count">20</div>
</section>

<!-- ══════════ 個人結果 ══════════ -->
<section class="screen" id="scr-result">
  <div class="res-icon" id="res-icon"></div>
  <div class="res-title" id="res-title">答啱喇！</div>
  <div class="res-points" id="res-points">+0</div>
  <div class="res-grid">
    <div class="res-cell">
      <div class="k">總分</div>
      <div class="v" id="res-score">0</div>
    </div>
    <div class="res-cell">
      <div class="k">排名</div>
      <div class="v" id="res-rank">—</div>
    </div>
  </div>
  <div class="streak-note" id="res-streak"></div>
</section>

<!-- ══════════ 最終 ══════════ -->
<section class="screen" id="scr-final">
  <div class="fin-eyebrow">Final Rank</div>
  <div class="fin-rank" id="fin-rank">—</div>
  <div class="fin-sub" id="fin-sub">名次</div>
  <div class="fin-name" id="fin-name">—</div>
  <div class="fin-score" id="fin-score">0 分</div>
  <button class="fin-again" id="btn-again">玩完好喇</button>
</section>

<div class="hint-bar" id="hint"></div>

<script src="/static/js/live.js"></script>
<script src="/static/js/play.js"></script>
</body>
</html>
