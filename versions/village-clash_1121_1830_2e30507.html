<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e7d3aa">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>村落爭霸｜本地單機</title>
<style>
  /* ============================================================
     村落爭霸 — Ikariam 風：羊皮紙 × 木框 × 銅金
     ============================================================ */
  :root{
    --sea:#3f9bc9; --sea2:#25678f;
    --parch:#f4e8ca; --parch2:#ecdbb6; --parch3:#dfcaa0; --parch4:#fdf7e6;
    --line:#c2a468; --line2:#8f6f3c;
    --ink:#3d2f1c; --dim:#7d6a49; --ok:#4a7226; --warn:#a3452a;
    --gold:#c9963f; --gold2:#a97b26; --bronze:#b98d4a;
    --maroon:#77301f;
    --clay:#a9713f; --leaf:#5d8a3a;
    --wood:#8a5a2b; --brick:#b06a44; --iron:#6d757c; --crop:#a8891f;
    --radius:9px;
    --ease:cubic-bezier(.22,1,.36,1);
    --serif:"Georgia","Songti TC","SimSun","Noto Serif TC",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 620px at 50% -240px,#83c8e8 0%,transparent 62%),
      linear-gradient(180deg,#4a9fcb 0%,#2f7ea6 45%,#215c78 100%);
    background-attachment:fixed;
    color:var(--ink); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    font-size:14px; line-height:1.55; -webkit-text-size-adjust:100%;
  }
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(420px 92px at 12% 10%,rgba(255,255,255,.16),transparent 70%),
      radial-gradient(330px 74px at 79% 20%,rgba(255,255,255,.13),transparent 70%),
      radial-gradient(520px 120px at 46% 5%,rgba(255,255,255,.10),transparent 70%);
  }
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(120% 80% at 50% 40%,transparent 45%,rgba(10,40,60,.22) 100%),
      repeating-linear-gradient(118deg,rgba(255,255,255,.05) 0 2px,transparent 2px 11px);
  }
  h1,h2,h3,p{margin:0}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  svg{display:block}
  .ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;
       stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

  /* ---------- 頂部資源列（羊皮紙橫匾） ---------- */
  .top{position:sticky;top:0;z-index:30;
       background:linear-gradient(180deg,#fdf6e3 0%,#f2e3c1 70%,#e7d3aa 100%);
       border-bottom:2px solid var(--line2);
       box-shadow:0 1px 0 #fff inset,0 3px 12px rgba(40,24,6,.28);
       padding-top:env(safe-area-inset-top)}
  .top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
       background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);pointer-events:none}
  .top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 14px}
  .brand{display:flex;align-items:baseline;gap:7px;white-space:nowrap}
  .brand b{font-family:var(--serif);font-size:18px;letter-spacing:.03em;font-weight:700;color:var(--maroon)}
  .brand span{font-size:9.5px;letter-spacing:.16em;color:#7b6338;
              border:1px solid var(--line);background:#fff8e6;padding:1px 6px;border-radius:3px}
  .resbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;flex:1;min-width:0}
  @media(min-width:900px){.resbar{max-width:620px}}
  .res{display:flex;align-items:center;gap:7px;
       background:linear-gradient(180deg,#fffaf0,#f5e8ca);
       border:1px solid var(--line);border-radius:5px;padding:4px 8px;min-width:0;
       box-shadow:0 1px 0 #fff inset,0 1px 2px rgba(90,60,20,.14)}
  .res .ico{width:18px;height:18px;color:var(--rc);stroke-width:1.9}
  .res .num{font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:.01em;white-space:nowrap;
            overflow:hidden;text-overflow:ellipsis;color:#3b2c15;font-weight:600}
  .res .cap{color:#8b7754;font-size:10.5px;margin-left:2px;font-weight:400}
  .res .rate{color:#6d5c3d;font-size:10.5px;margin-left:5px;font-weight:400}
  .res .meter{height:3px;background:#e3d1a9;border-radius:2px;margin-top:3px;overflow:hidden}
  .res .meter i{display:block;height:100%;background:var(--rc);opacity:.85;width:0;transition:width .3s linear}
  .hud{display:flex;gap:14px;font-size:11px;color:#6d5c3d;white-space:nowrap}
  .hud b{color:var(--maroon);font-variant-numeric:tabular-nums}
  @media(max-width:720px){ .hud{display:none} .brand span{display:none} }
  @media(max-width:560px){
    .top-in{gap:8px;padding:7px 10px}
    .brand b{font-size:16px}
    .resbar{gap:5px}
    .res{gap:5px;padding:3px 6px}
    .res .ico{width:15px;height:15px}
    .res .num{font-size:11.5px}
    .res .cap,.res .rate{display:none}
  }

  /* ---------- 版面 ---------- */
  .shell{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:14px 14px 150px;
         display:grid;grid-template-columns:194px minmax(0,1fr);gap:14px}
  @media(max-width:860px){
    .shell{grid-template-columns:minmax(0,1fr);padding:12px 12px 168px}
  }
  nav.tabs{display:flex;flex-direction:column;gap:5px;align-self:start;position:sticky;top:64px}
  nav.tabs button{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:6px;
      border:1px solid transparent;color:#5f4d2f;text-align:left;font-size:13.5px;font-weight:500;
      transition:background .12s var(--ease),color .12s var(--ease),box-shadow .12s var(--ease)}
  nav.tabs button .ico{width:18px;height:18px;opacity:.85}
  nav.tabs button:hover{background:rgba(253,246,227,.55)}
  nav.tabs button.on{background:linear-gradient(180deg,#fdf7e6,#eddcb6);border-color:var(--line);
      color:var(--maroon);font-weight:600;
      box-shadow:inset 3px 0 0 var(--gold),0 1px 0 #fff inset,0 2px 5px rgba(70,45,12,.15)}
  nav.tabs button:active{background:#f6e9cd}
  @media(max-width:860px){
    nav.tabs{position:fixed;top:auto;left:0;right:0;bottom:0;flex-direction:row;gap:0;z-index:28;
      background:linear-gradient(180deg,#fdf6e3,#e9d6ae);border-top:2px solid var(--line2);
      box-shadow:0 -2px 10px rgba(30,18,4,.28);
      padding:4px 4px calc(4px + env(safe-area-inset-bottom));
      overflow-x:auto;scrollbar-width:none}
    nav.tabs::-webkit-scrollbar{display:none}
    nav.tabs button{flex:0 0 auto;min-width:66px;flex-direction:column;gap:2px;font-size:10.5px;
      padding:6px 4px;border:0;border-radius:6px;font-weight:500}
    nav.tabs button.on{box-shadow:inset 0 -2px 0 var(--gold)}
    nav.tabs button .ico{width:20px;height:20px}
  }

  @media(min-width:861px){
    nav.tabs{background:linear-gradient(180deg,#fdf7e6,#efdfbc);border:1px solid var(--line2);
      border-radius:var(--radius);padding:8px;
      box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 4px 16px rgba(38,24,6,.22)}
  }

  .stage{min-width:0}
  .panel{position:relative;background:linear-gradient(180deg,#fdf7e6 0%,#f4e7c8 60%,#efdfbc 100%);
         border:1px solid var(--line2);border-radius:var(--radius);padding:14px;
         box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 0 0 1px #e8d8b0 inset,0 4px 16px rgba(38,24,6,.22)}
  .panel + .panel{margin-top:12px}
  .panel{background-image:url(assets/paper.jpg),linear-gradient(180deg,#fdf7e6 0%,#f4e7c8 60%,#efdfbc 100%);
    background-size:512px auto,auto;background-blend-mode:multiply}
  .ph{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
      margin:-2px 0 12px;padding-bottom:8px;border-bottom:1px solid #dcc59a;flex-wrap:wrap}
  .ph h2{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:.02em;color:var(--maroon)}
  .ph h2::before{content:"❖";color:var(--gold);font-size:10px;vertical-align:3px;margin-right:7px;
    text-shadow:0 1px 0 rgba(255,255,255,.7)}
  .ph .sub{font-size:11.5px;color:var(--dim)}
  .hint{display:flex;gap:8px;align-items:flex-start;
        background:linear-gradient(180deg,#fbf1d6,#f3e4c0);border:1px dashed #bda069;
        border-radius:6px;padding:9px 11px;font-size:12px;color:#6d5c3d;margin-bottom:12px}
  .hint .ico{color:var(--gold2)}
  .hint b{color:var(--ink);font-weight:700}

  /* ---------- 村莊卡 ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
  .bcard{position:relative;display:flex;flex-direction:column;gap:5px;text-align:left;
    background:linear-gradient(180deg,#fffaf0,#f4e7c8);border:1px solid #cdb183;
    border-radius:7px;padding:10px 10px 11px;overflow:hidden;color:var(--ink);
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 2px 5px rgba(85,55,15,.13);
    transition:transform .12s var(--ease),box-shadow .12s var(--ease),border-color .12s var(--ease)}
  .bcard:hover{transform:translateY(-1px);border-color:var(--gold2);
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 4px 12px rgba(85,55,15,.22)}
  .bcard:active{transform:scale(.993)}
  .bcard .top-row{display:flex;align-items:center;gap:8px;color:var(--acc,var(--maroon))}
  .bcard .top-row .ico{width:19px;height:19px}
  .bcard .bic{position:relative;width:42px;height:42px;flex:0 0 auto;display:grid;place-items:center;
        border-radius:7px;background:linear-gradient(180deg,#f2dfad,#e2c68d);border:1px solid #c2a468;
        overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.6) inset}
  .bcard .bic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .bcard .bic .ico{width:20px;height:20px;opacity:.85}
  .bcard .top-row .nm{line-height:1.25}
  .bcard .nm{font-size:13px;font-weight:700;color:#43331a}
  .bcard .lv{margin-left:auto;font-size:10.5px;color:#4d3512;font-variant-numeric:tabular-nums;
             background:linear-gradient(180deg,#f3dba6,#dfbd7c);border:1px solid #b28d4a;
             border-radius:20px;padding:0 7px;font-weight:700}
  .bcard .ln{font-size:11.5px;color:#7a6644;min-height:17px}
  .bcard .ln b{color:#43331a;font-weight:700}
  .bcard.locked{opacity:.55;filter:saturate(.55)}
  .bcard.busy{border-color:var(--gold2);box-shadow:0 0 0 2px rgba(201,150,63,.3),0 1px 0 #fff inset}
  .bcard .prog{position:absolute;left:0;bottom:0;height:3px;background:#e6d3a9;width:100%}
  .bcard .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0}

  /* ---------- 村落：草地＋建築 sprite ---------- */
  .villmap{border-radius:8px;overflow:hidden;border:1px solid #2f5e22;position:relative;
    background:url(assets/terrain.jpg) center/cover;
    box-shadow:inset 0 0 70px rgba(8,26,4,.35),0 3px 10px rgba(20,40,10,.25)}
  .plotgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding:8px}
  @media(max-width:760px){ .plotgrid{grid-template-columns:repeat(3,minmax(0,1fr))} }
  .plot{position:relative;height:106px;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-end;padding:0 0 2px;background:none;border:0;cursor:pointer}
  .plot img{max-width:94%;max-height:86px;object-fit:contain;
    filter:drop-shadow(0 7px 6px rgba(0,0,0,.38));transition:transform .12s}
  .plot:hover img{transform:translateY(-2px) scale(1.04)}
  .plot .pllv{position:absolute;left:3px;top:1px;font-size:9px;font-weight:700;color:#3f2a0c;
    background:linear-gradient(180deg,#f3dba6,#dfbd7c);border:1px solid #a8763a;border-radius:20px;
    padding:0 5px;box-shadow:0 1px 0 rgba(255,255,255,.6) inset}
  .plot .plname{font-size:9.5px;color:#fffdf3;text-shadow:0 1px 3px rgba(0,0,0,.85);margin-top:1px}
  .plot.empty{border:1px dashed rgba(255,248,225,.4);border-radius:8px;margin:5px;height:96px;
    justify-content:center;gap:3px;background:rgba(20,40,10,.16)}
  .plot.empty .plflag .ico{width:17px;height:17px;color:#ffdca8;opacity:.95}
  .plot.empty .plempty{font-size:9.5px;color:#f6ecd2;text-shadow:0 1px 3px rgba(0,0,0,.8)}
  .plot.busy{outline:2px solid rgba(233,180,80,.85);border-radius:8px}
  .plot .plprog{position:absolute;left:0;bottom:0;height:3px;width:100%;background:rgba(0,0,0,.4)}
  .plot .plprog i{display:block;height:100%;background:linear-gradient(90deg,#f0c86a,#c9963f)}
  .plotlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:#7a6644;margin-top:10px}
  .plotlegend span{display:flex;align-items:center;gap:4px}

  /* ---------- 世界地圖（全屏海圖） ---------- */
  .worldpanel{padding-bottom:10px}
  .worldmap{position:relative;height:520px;border-radius:10px;overflow:hidden;border:1px solid #1f5673;
    background:radial-gradient(120% 95% at 50% 0%,#63b2d8 0%,#2f7ea6 45%,#1c5271 100%);
    cursor:grab;touch-action:none;box-shadow:inset 0 0 80px rgba(3,25,40,.4)}
  .worldmap:active{cursor:grabbing}
  .worldmap::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(112deg,rgba(255,255,255,.055) 0 2px,transparent 2px 13px)}
  .wmap-inner{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:center}
  .wisle{position:absolute;width:14.5%;min-width:104px;transform:translate(-50%,-50%);background:none;border:0;cursor:pointer;padding:0}
  .wisle img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;
    border-radius:50% 46% 52% 48%/46% 54% 46% 54%;
    box-shadow:0 8px 20px rgba(3,25,40,.5);
    -webkit-mask-image:radial-gradient(closest-side,#000 72%,transparent 97%);
    mask-image:radial-gradient(closest-side,#000 72%,transparent 97%);
    transition:transform .12s}
  .wisle:hover img{transform:scale(1.05)}
  .wisle.mine img{box-shadow:0 0 0 3px rgba(233,190,110,.9),0 10px 24px rgba(0,0,0,.45)}
  .wisle:nth-child(3n) img{filter:saturate(.92) brightness(1.03)}
  .wisle:nth-child(4n) img{filter:saturate(1.06)}
  .wname{display:block;text-align:center;font-size:11px;font-weight:700;color:#fffdf3;
    text-shadow:0 1px 4px rgba(0,0,0,.85);margin-top:2px}
  .wsub{display:block;text-align:center;font-size:9px;color:#eaf6ff;opacity:.92;text-shadow:0 1px 3px rgba(0,0,0,.85)}
  .wzoom{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:3}
  .wzoom button{width:30px;height:30px;border-radius:6px;font-size:17px;font-weight:700;line-height:1;
    color:#3f2a0c;background:linear-gradient(180deg,#fdf7e6,#e7d3a7);border:1px solid #a98a55;
    box-shadow:0 2px 7px rgba(0,0,0,.35)}
  .wcompass{position:absolute;right:12px;bottom:10px;z-index:3;
    display:flex;gap:8px;align-items:center;padding:4px 13px;border-radius:20px;font-size:11px;color:#4a3417;
    background:linear-gradient(180deg,rgba(253,247,230,.96),rgba(233,214,174,.96));border:1px solid #a98a55;
    box-shadow:0 3px 10px rgba(0,0,0,.32)}
  .wcompass b{font-weight:700;color:var(--maroon)}
  @media(max-width:760px){ .worldmap{height:400px} .wisle{width:27%;min-width:92px} .wsub{display:none} }

  /* ---------- 小島地圖（中央神蹟＋環形城鎮） ---------- */
  .islemap{position:relative;border-radius:10px;overflow:hidden;border:1px solid #1f5673;
    background:#2f7ea6;aspect-ratio:16/9;min-height:320px}
  @media(max-width:760px){ .islemap{aspect-ratio:4/5} }
  .islemap .islefix{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 55%}
  .isleflex{position:absolute;inset:0}
  .wonder{position:absolute;left:41%;top:36%;width:17%;min-width:72px;display:flex;flex-direction:column;
    align-items:center;background:none;border:0;cursor:pointer}
  .wonder img{width:100%;filter:drop-shadow(0 10px 12px rgba(0,0,0,.5))}
  .wonder:hover img{transform:scale(1.04)}
  .wonder .wlv{position:absolute;bottom:-2px;font-size:10px;font-weight:700;color:#3f2a0c;
    background:linear-gradient(180deg,#f3dba6,#dfbd7c);border:1px solid #a8763a;border-radius:20px;padding:0 6px}
  .respad{position:absolute;right:2.5%;top:2.5%;display:flex;align-items:center;gap:5px;
    font-size:10.5px;color:#4a3417;background:rgba(253,247,230,.9);border:1px solid #a98a55;
    border-radius:5px;padding:2px 8px}
  .tslot{position:absolute;transform:translate(-50%,-50%);min-width:84px;max-width:130px;padding:3px 7px;
    border-radius:6px;text-align:left;border:1px solid #a98a55;
    background:linear-gradient(180deg,rgba(253,247,230,.95),rgba(240,226,193,.95));
    box-shadow:0 2px 7px rgba(8,26,12,.45)}
  .tslot.mine{border-color:#c9963f;box-shadow:0 0 0 2px rgba(201,150,63,.6),0 2px 9px rgba(0,0,0,.4)}
  .tslot .tsname{display:block;font-size:10.5px;font-weight:700;color:#43331a;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .tslot .tsst{display:block;font-size:9px;color:#6d5c3d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wonderbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;
    padding:8px 11px;border:1px solid #d3b98c;border-radius:7px;font-size:12.5px;
    background:linear-gradient(180deg,#fffaf0,#f5e8ca)}

  /* 空地建築選單 */
  .bopts{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:56vh;overflow:auto}
  .boption{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;align-items:center;text-align:left;
    padding:8px 10px;border:1px solid #d3b98c;border-radius:7px;background:linear-gradient(180deg,#fffaf0,#f5e8ca)}
  .boption:hover{border-color:var(--gold2)}
  .boption.no{opacity:.55}
  .boption .boic{width:28px;height:28px;display:grid;place-items:center;color:var(--clay)}
  .boption .bonm{font-size:12.5px;font-weight:700;color:#43331a}
  .boption .bonm small{font-weight:400;color:#8b7754;font-size:10px;margin-left:4px}
  .boption .bocost{font-size:10px;color:#7a6644}
  .boption .bobtn{font-size:10.5px;font-weight:700;color:#4a3417;border:1px solid #b28d4a;border-radius:5px;
    padding:2px 8px;background:linear-gradient(180deg,#f3dba6,#dfbd7c)}

  /* ---------- 村莊橫幅（小島景） ---------- */
  .banner{position:relative;margin:-14px -14px 12px;border-radius:9px 9px 0 0;overflow:hidden;
          border-bottom:1px solid var(--line2);background:#2f7ea6}
  .banner::after{content:"";position:absolute;inset:0;pointer-events:none;
          background:linear-gradient(180deg,rgba(12,30,40,0) 42%,rgba(16,32,14,.62) 100%)}
  .banner .bsvg{display:block;width:100%;height:146px}
  .banner .bimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
          object-position:center 72%;display:block}
  .banner .cap{position:absolute;z-index:2;left:12px;bottom:9px;display:flex;align-items:baseline;gap:10px;
          flex-wrap:wrap;padding:5px 12px 6px;border-radius:6px;
          background:linear-gradient(180deg,rgba(253,247,230,.96),rgba(240,226,193,.96));
          border:1px solid #a98a55;box-shadow:0 2px 8px rgba(12,26,8,.45),0 1px 0 #fff inset;
          max-width:calc(100% - 24px)}
  .banner .cap b{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--maroon);letter-spacing:.04em}
  .banner .cap span{font-size:11px;color:#6d5c3d}
  @media(max-width:560px){ .banner .bsvg{height:104px} .banner .bimg{object-position:center 76%}
    .banner .cap b{font-size:17px} }

  /* ---------- 地圖 ---------- */
  .islandmap{background:
      radial-gradient(120% 90% at 50% 0%,#7cc4e6 0%,#3f9bc9 45%,#25678f 100%);
      border:1px solid #1f5673;border-radius:8px;padding:10px;
      box-shadow:inset 0 0 34px rgba(4,30,45,.35)}
  .mapwrap{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:520px;margin:0 auto}
  .tile{aspect-ratio:1;border:1px solid #8fa86a;border-radius:6px;
        background:linear-gradient(180deg,#d6e4b8,#b9cf92);
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
        color:#41571f;font-size:9.5px;padding:2px;transition:transform .12s,box-shadow .12s;
        box-shadow:0 1px 0 rgba(255,255,255,.55) inset}
  .tile .ico{width:19px;height:19px}
  .tile.t1{color:#3f5c1c;background:linear-gradient(180deg,#d6e4b8,#b9cf92);border-color:#8fa86a}
  .tile.t2{color:#6b4a18;background:linear-gradient(180deg,#efd7a6,#ddbe83);border-color:#b08c55}
  .tile.t3{color:#7a2f1a;background:linear-gradient(180deg,#edbb9c,#db9d7a);border-color:#b5704f}
  .tile.home{background:linear-gradient(180deg,#f8e2ad,#e3c583);border-color:var(--gold2);color:#5a3c12;
    box-shadow:0 0 0 2px rgba(255,255,255,.35) inset,0 0 0 2px rgba(201,150,63,.5)}
  .tile:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(6,30,45,.3)}
  .tile.empty{opacity:.42;background:linear-gradient(180deg,#a9cfe0,#8fbdd4);border-color:#5f93ad;color:#2f5f78}
  .tile small{font-size:8.5px;opacity:.8}
  .legend{display:flex;gap:12px;justify-content:center;font-size:11px;color:#f0f7fb;
          margin-top:10px;flex-wrap:wrap;text-shadow:0 1px 2px rgba(6,30,45,.5)}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;
            border:1px solid rgba(0,0,0,.25)}

  /* ---------- 兵營 ---------- */
  .unit{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;
        padding:10px 11px;border:1px solid #d3b98c;border-radius:7px;
        background:linear-gradient(180deg,#fffaf0,#f5e8ca);
        box-shadow:0 1px 0 rgba(255,255,255,.85) inset}
  .unit + .unit{margin-top:8px}
  .civ-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#5a3c1c;
         margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid #dcc59a}
  .civ-h:first-child{margin-top:0}
  .civ-h .cdot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
  .civ-h .sub{font-weight:400;font-size:11px;color:var(--dim)}
  .civ-h .csum{margin-left:auto;font-weight:400;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .civtabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin-bottom:4px;scrollbar-width:none}
  .civtabs::-webkit-scrollbar{display:none}
  .ct{flex:0 0 auto;font-size:11.5px;padding:4px 11px;border:1px solid #cbb082;border-radius:20px;
      color:#6d5c3d;background:linear-gradient(180deg,#fdf7e6,#f2e4c5);
      transition:color .12s,border-color .12s,background .12s}
  .ct:hover{border-color:var(--gold2)}
  .ct.on{color:#4a3417;border-color:var(--gold2);font-weight:700;
      background:linear-gradient(180deg,#f7e0af,#e6c98f)}
  .unit .ic{position:relative;width:56px;height:56px;flex:0 0 auto;border-radius:7px;display:grid;place-items:center;
    color:var(--clay);overflow:hidden;background:linear-gradient(180deg,#f2dfad,#e2c68d);border:1px solid #c2a468;
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset}
  .unit .ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .unit .ic .ico{width:22px;height:22px;opacity:.85}
  .unit .nm{font-size:13.5px;font-weight:700;color:#43331a}
  .unit .st{font-size:11px;color:#7a6644;margin-top:1px}
  .unit .own{font-size:11.5px;color:var(--ok);font-variant-numeric:tabular-nums;font-weight:700}
  .btnrow{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .btn{background:linear-gradient(180deg,#f8e9c4,#e7d09d);border:1px solid #b08b4c;border-radius:5px;
       padding:5px 11px;font-size:12px;color:#4a3417;font-weight:600;
       box-shadow:0 1px 0 rgba(255,255,255,.75) inset,0 1px 2px rgba(90,60,20,.18);
       transition:background .12s,transform .08s}
  .btn:hover{background:linear-gradient(180deg,#fdf2d6,#eedaab)}
  .btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(255,255,255,.4) inset}
  .btn.primary{background:linear-gradient(180deg,#dcac52,#b8801f);border-color:#8c5f13;color:#2c1c04;
       text-shadow:0 1px 0 rgba(255,255,255,.3)}
  .btn.primary:hover{background:linear-gradient(180deg,#e6b75f,#c68b2b)}
  .btn:disabled{opacity:.45;cursor:not-allowed;background:linear-gradient(180deg,#efe4cb,#e2d3b1);color:#8a7857}
  .btn.ghost{background:transparent;box-shadow:none;border-color:#c2a468}

  /* ---------- 發展（科技／貿易） ---------- */
  .island{display:flex;gap:9px;align-items:flex-start;
          background:linear-gradient(180deg,#f7efd6,#eee0ba);border:1px dashed #bda069;
          border-radius:7px;padding:9px 11px;font-size:12.5px;margin-bottom:12px;color:var(--ink)}
  .island .ico{width:20px;height:20px;color:var(--ok);flex:0 0 auto;margin-top:1px}
  .island .st{font-size:11px;color:var(--dim);margin-top:2px}
  .tech{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;
        padding:9px 11px;border:1px solid #d3b98c;border-radius:7px;
        background:linear-gradient(180deg,#fffaf0,#f5e8ca)}
  .tech + .tech{margin-top:7px}
  .tech.on{border-color:#9db878;background:linear-gradient(180deg,#f7f4dc,#eef0cf)}
  .tech .tic{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:var(--bc,var(--ok));
        background:linear-gradient(180deg,#f2dfad,#e2c68d);border:1px solid #c2a468}
  .tech .tic .ico{width:18px;height:18px}
  .tech .nm{font-size:13px;font-weight:700;color:#43331a}
  .tech .st{font-size:11px;color:#7a6644}
  .tech .st.w{color:var(--warn)}
  .tech .tr{display:flex;flex-direction:column;gap:4px;align-items:flex-end;text-align:right}
  .tech .ok{font-size:10.5px;letter-spacing:.06em;padding:1px 8px;border-radius:4px;font-weight:700;
            background:linear-gradient(180deg,#e8f0cd,#d3e3ac);color:#3f6320;border:1px solid #9db878}
  .picklbl{font-size:11px;color:var(--dim);margin:10px 0 5px;letter-spacing:.04em}
  .pickrow{display:flex;gap:6px;flex-wrap:wrap}
  .tradebox{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;
            margin-top:12px;padding:9px 11px;border:1px solid #d3b98c;border-radius:7px;
            background:linear-gradient(180deg,#fffaf0,#f5e8ca);font-size:12.5px}
  .tradebox .st{font-size:11px;color:var(--dim);margin-top:3px}
  .tradebox b{font-variant-numeric:tabular-nums;color:#43331a}

  /* ---------- 戰報 ---------- */
  .rep{border:1px solid #d3b98c;border-radius:7px;padding:9px 11px;
       background:linear-gradient(180deg,#fffaf0,#f5e8ca)}
  .rep + .rep{margin-top:8px}
  .rep .rh{display:flex;align-items:center;gap:8px;font-size:13px;color:#43331a}
  .rep .win{font-size:10px;letter-spacing:.08em;padding:1px 7px;border-radius:4px;font-weight:700;
            background:linear-gradient(180deg,#e8f0cd,#d3e3ac);color:#3f6320;border:1px solid #9db878}
  .rep .lose{background:linear-gradient(180deg,#f6dccf,#eec3ac);color:#8d3517;border-color:#c98a6c}
  .rep .rt{font-size:10.5px;color:var(--dim);margin-left:auto}
  .rep .rb{font-size:11.5px;color:#6d5c3d;margin-top:6px;line-height:1.7}
  .rep .rb b{color:#43331a}
  .empty{color:var(--dim);font-size:12.5px;padding:18px 4px;text-align:center;line-height:1.9}
  .feed{display:flex;flex-direction:column}
  .fi{display:flex;gap:10px;font-size:12.5px;padding:7px 0;border-bottom:1px solid #e6d5ae;color:var(--ink)}
  .step-t{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.01em;
          margin-bottom:4px;color:var(--maroon)}
  .step-d{font-size:12.5px;color:#6d5c3d;line-height:1.7;margin-bottom:11px}
  .fi:last-child{border-bottom:0}
  .fi .ft{color:var(--dim);font-variant-numeric:tabular-nums;font-size:11px;min-width:38px}

  /* ---------- 底部隊列（木框） ---------- */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:26;
        background:linear-gradient(180deg,#7d5a32 0%,#5c3f1d 55%,#46301a 100%);
        border-top:2px solid #35230f;
        box-shadow:0 1px 0 rgba(255,236,200,.22) inset,0 -4px 16px rgba(16,8,0,.4);
        padding:7px 12px calc(7px + env(safe-area-inset-bottom))}
  @media(max-width:860px){ .dock{bottom:64px;padding-bottom:7px} }
  .dock-in{max-width:1180px;margin:0 auto;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
  .dock-in::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;
        background:linear-gradient(180deg,#fdf7e6,#eddcb6);border:1px solid #a98a55;border-radius:5px;
        padding:5px 9px;font-size:11.5px;max-width:260px;color:#3b2c15;
        box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 1px 3px rgba(0,0,0,.28)}
  .chip .ico{width:15px;height:15px;color:var(--gold2)}
  .chip .cp{position:relative;height:3px;background:#e0cda6;border-radius:2px;margin-top:4px;width:120px;overflow:hidden}
  .chip .cp i{display:block;height:100%;background:linear-gradient(90deg,#8fae5c,#4f7a2a);width:0}
  .chip .tm{color:#7a6644;font-variant-numeric:tabular-nums}
  .chip.done{border-color:#8fb06a}
  .dock .idle{font-size:11.5px;color:#f0e2c2;opacity:.85;padding:5px 2px}

  /* ---------- Modal ---------- */
  .modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:18px}
  .modal.hidden{display:none}
  .modal .bg{position:absolute;inset:0;background:rgba(30,20,6,.62);backdrop-filter:blur(2px)}
  .card{position:relative;width:100%;max-width:430px;max-height:86vh;overflow:auto;
        background-image:url(assets/paper.jpg);background-size:512px auto;background-blend-mode:multiply;
        background:linear-gradient(180deg,#fdf7e6 0%,#f2e4c5 100%);
        border:1px solid var(--line2);border-radius:11px;padding:16px;
        box-shadow:0 0 0 1px rgba(255,255,255,.7) inset,0 24px 60px rgba(20,10,0,.5);
        animation:pop .18s var(--ease)}
  @keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .card h3{font-family:var(--serif);font-size:17px;display:flex;align-items:center;gap:8px;color:var(--maroon)}
  .card h3 .ico{color:var(--gold2)}
  .card .desc{font-size:12.5px;color:#6d5c3d;margin-top:6px;line-height:1.65}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:6px 0;
      border-bottom:1px solid #e6d5ae;color:#43331a}
  .kv:last-child{border-bottom:0}
  .kv span{color:#6d5c3d}
  .cost{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:10px 0 4px}
  .cost .ci{display:flex;align-items:center;gap:6px;font-size:12.5px;font-variant-numeric:tabular-nums;color:#43331a}
  .cost .ci .ico{width:16px;height:16px;color:var(--rc)}
  .cost .ci.no{color:var(--warn)}
  .card .foot{display:flex;gap:8px;margin-top:14px}
  .card .foot .btn{flex:1;text-align:center;padding:9px}
  .card h3 .bic.big{width:38px;height:38px}
  .card h3 .bic{position:relative;width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;
        border-radius:7px;background:linear-gradient(180deg,#f2dfad,#e2c68d);border:1px solid #c2a468;overflow:hidden}
  .card h3 .bic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .card h3 .bic .ico{width:18px;height:18px;opacity:.8}
  .close{position:absolute;top:10px;right:10px;color:#8a7857;font-size:18px;line-height:1;padding:4px}
  .inp{display:flex;align-items:center;gap:8px;border:1px solid #d3b98c;border-radius:6px;
       background:#fbf3dd;padding:6px 9px;margin-top:7px}
  .inp label{font-size:12px;color:#6d5c3d;flex:1}
  .inp input{width:66px;background:#fffaf0;border:1px solid #cbb082;border-radius:4px;color:var(--ink);
             padding:4px 6px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
  .inp .own{font-size:10.5px;color:#7a6644;min-width:44px;text-align:right}

  /* ---------- 城池列 ---------- */
  .citybar{background:linear-gradient(180deg,#f2e3c1,#e3d0a7);border-bottom:1px solid var(--line2);
           box-shadow:0 2px 6px rgba(40,24,6,.14)}
  .citybar-in{max-width:1180px;margin:0 auto;display:flex;gap:6px;padding:5px 14px;
              overflow-x:auto;scrollbar-width:none}
  .citybar-in::-webkit-scrollbar{display:none}
  .cc{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 10px;
      border-radius:20px;border:1px solid #c2a468;background:#fdf7e6;color:#5f4d2f;white-space:nowrap}
  .cc span{font-size:10px;color:#8b7754}
  .cc.on{background:linear-gradient(180deg,#f6dfae,#e2c184);border-color:var(--gold2);
         color:#4a3417;font-weight:700;box-shadow:0 1px 0 #fff inset}
  .cc.on span{color:#6d5433}

  /* ---------- 城池頁／外交頁 ---------- */
  .cityrow{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;
    border:1px solid #d3b98c;border-radius:7px;padding:9px 11px;margin-bottom:8px;
    background:linear-gradient(180deg,#fffaf0,#f5e8ca);box-shadow:0 1px 0 rgba(255,255,255,.8) inset}
  .cityrow.on{border-color:var(--gold2);background:linear-gradient(180deg,#fdf0cf,#f0dfb6);
    box-shadow:0 0 0 1px rgba(201,150,63,.35),0 1px 0 #fff inset}
  .cityrow .cnm{font-size:13.5px;font-weight:700;color:#43331a;display:flex;align-items:center;gap:8px}
  .cityrow .st{font-size:11px;color:#7a6644}
  .cityrow .cact{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .tag{font-size:10px;padding:1px 7px;border-radius:4px;border:1px solid #c2a468;color:#6d5c3d;
       background:#f7eed6;font-weight:700;white-space:nowrap}
  .tag.ok{background:linear-gradient(180deg,#e8f0cd,#d3e3ac);color:#3f6320;border-color:#9db878}
  .tag.bad{background:linear-gradient(180deg,#f6dccf,#eec3ac);color:#8d3517;border-color:#c98a6c}
  .fac{border:1px solid #d3b98c;border-radius:7px;padding:10px 11px;margin-bottom:8px;
    background:linear-gradient(180deg,#fffaf0,#f5e8ca);box-shadow:0 1px 0 rgba(255,255,255,.8) inset}
  .fac .fhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;color:#43331a}
  .fac .fico{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;
    overflow:hidden;background:linear-gradient(180deg,#f2dfad,#e2c68d);border:1px solid #c2a468}
  .fac .fico img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .fac .fico .ico{position:relative;z-index:2;width:19px;height:19px;stroke-width:2;
    color:#6d3316;filter:drop-shadow(0 1px 0 rgba(255,255,255,.65))}
  .fac .fico .ico{width:16px;height:16px}
  .fac .fhead .st{margin-left:auto;font-size:11px;color:#7a6644}
  .fac .relbar{height:6px;border-radius:3px;background:#e6d3a9;margin:8px 0 4px;overflow:hidden;
    border:1px solid #d8c096}
  .fac .relbar i{display:block;height:100%;transition:width .3s}
  .fac .st{font-size:11px;color:#7a6644}

  /* ---------- 三層地圖 ---------- */
  .mapsw{display:flex;gap:6px;margin:-2px 0 12px;flex-wrap:wrap}
  .ms{font-size:12px;padding:5px 13px;border-radius:5px;border:1px solid #c2a468;
      background:linear-gradient(180deg,#fdf7e6,#f2e4c5);color:#5f4d2f;font-weight:600;
      box-shadow:0 1px 0 rgba(255,255,255,.7) inset}
  .ms.on{background:linear-gradient(180deg,#dcac52,#b8801f);border-color:#8c5f13;color:#2c1c04}
  .islegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
  .isle{display:flex;gap:9px;align-items:center;text-align:left;padding:8px;border-radius:8px;
    border:1px solid #cdb183;background:linear-gradient(180deg,#fffaf0,#f4e7c8);
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 2px 5px rgba(85,55,15,.14);
    transition:transform .12s,border-color .12s,box-shadow .12s;position:relative}
  .isle:hover{transform:translateY(-1px);border-color:var(--gold2);box-shadow:0 4px 12px rgba(85,55,15,.22)}
  .isle.mine{border-color:var(--gold2);box-shadow:0 0 0 2px rgba(201,150,63,.3),0 1px 0 #fff inset}
  .isle .ithumb{width:78px;height:58px;flex:0 0 auto;border-radius:6px;overflow:hidden;
    border:1px solid #b59357;background:#2f7ea6;position:relative}
  .isle .ithumb img{width:100%;height:100%;object-fit:cover;display:block}
  .isle .ibody{display:flex;flex-direction:column;gap:1px;min-width:0}
  .isle .iname{font-size:13.5px;font-weight:700;color:#43331a}
  .isle .iname small{font-size:10px;color:#8b7754;font-weight:400}
  .isle .ist{font-size:10.5px;color:#7a6644;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .isle .ibadge{position:absolute;right:7px;top:7px;font-size:10px;font-weight:700;color:#2c1c04;
    background:linear-gradient(180deg,#f3dba6,#dfbd7c);border:1px solid #b28d4a;border-radius:20px;padding:0 7px}
  .crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#6d5c3d;margin:-2px 0 11px}
  .crumb b{color:var(--maroon);font-family:var(--serif);font-size:14px}
  .crumb .st{color:#8b7754;font-size:11px}
  .crumbb{border:1px solid #c2a468;background:#fdf7e6;border-radius:4px;padding:1px 8px;
    font-size:11.5px;color:#6d5c3d}
  .islandview{display:flex;flex-direction:column;gap:11px}
  .isleart{position:relative;border-radius:8px;overflow:hidden;border:1px solid #1f5673;
    background:#2f7ea6;height:230px}
  .isleart img{width:100%;height:100%;object-fit:cover;object-position:center 62%;display:block}
  @media(max-width:560px){ .isleart{height:150px} }
  .islecap{position:absolute;left:9px;bottom:9px;padding:4px 10px;border-radius:5px;
    background:linear-gradient(180deg,rgba(253,247,230,.95),rgba(240,226,193,.95));
    border:1px solid #a98a55;display:flex;flex-direction:column;line-height:1.3}
  .islecap b{font-family:var(--serif);font-size:15px;color:var(--maroon)}
  .islecap span{font-size:10.5px;color:#6d5c3d}
  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:7px}
  .slot{display:flex;gap:9px;align-items:center;text-align:left;padding:7px 9px;border-radius:7px;
    border:1px solid #d3b98c;background:linear-gradient(180deg,#fffaf0,#f5e8ca);
    box-shadow:0 1px 0 rgba(255,255,255,.85) inset;transition:border-color .12s,transform .12s}
  .slot:hover{border-color:var(--gold2);transform:translateX(1px)}
  .slot.mine{border-color:#c9963f;background:linear-gradient(180deg,#fdf0cf,#f0dfb6)}
  .slot .sidx{width:22px;height:22px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;
    font-size:10.5px;font-weight:700;color:#4d3512;background:linear-gradient(180deg,#f3dba6,#dfbd7c);
    border:1px solid #b28d4a}
  .slot .sinfo{display:flex;flex-direction:column;min-width:0}
  .slot .sname{font-size:12.5px;font-weight:700;color:#43331a}
  .slot .sst{font-size:10.5px;color:#7a6644;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- 地圖小標記 ---------- */
  .tile{position:relative}
  .tile .fd{position:absolute;right:4px;bottom:4px;width:6px;height:6px;border-radius:50%;
    box-shadow:0 0 0 1px rgba(255,255,255,.6)}
  .tile .sea{position:absolute;left:3px;top:3px;color:#245e78;opacity:.7}
  .tile .sea .ico{width:11px;height:11px;stroke-width:2.2}
  .tile .sea.mine{color:#2f6b2a;opacity:1}

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

  const b = isleOf(t.islandId == null ? 0 : t.islandId);

function makeWorld(){
  const rnd = mulberry32(20261121);
  const islands = ISLE_LAYOUT.map((o, i) => Object.assign({}, o, {
    wonder: {type: WONDER_ORDER[i % WONDER_ORDER.length], lv: 1}
  }));
  const towns = [];
  let tid = 1, ni = 0;
  islands.forEach(isl => {
    for (let s = 0; s < TOWNS_PER_ISLE; s++){
      const tier = s < 3 ? 1 : s < 6 ? 2 : 3;
      const def = Math.round({1: 90, 2: 270, 3: 640}[tier] * (0.9 + rnd() * 0.25));
      const total = Math.round({1: 900, 2: 2100, 3: 4200}[tier] * (0.9 + rnd() * 0.25));
      const w = [0.4 + rnd() * 0.5, 0.4 + rnd() * 0.5, 0.3 + rnd() * 0.5, 0.4 + rnd() * 0.5];
      const sw = w[0] + w[1] + w[2] + w[3];
      const loot = {}, max = {};
      RES.forEach((r, i) => { const v = Math.round(total * w[i] / sw); max[r] = v; loot[r] = v; });
      towns.push({
        id: tid++, islandId: isl.id, slot: s, type: 'enemy',
        name: TOWN_NAMES[ni++ % TOWN_NAMES.length],
        tier, def, loot, max,
        fac: FACTIONS[tid % FACTIONS.length].k,
        coastal: true,
        sea: {def: Math.round({1: 150, 2: 340, 3: 700}[tier] * (0.9 + rnd() * 0.2)), owner: 'enemy'},
        x: isl.x, y: isl.y
      });
    }
  });
  return {islands, towns};
}

function normalizeState(s){
  if (!s || (!s.map && !s.towns && !s.cities)) return newState();
  const world = makeWorld();
  const st = {
    v: 3, active: 0, cities: [], tab: s.tab || 'village', civ: s.civ || 'all',
    rp: typeof s.rp === 'number' && isFinite(s.rp) ? s.rp : 0,
    tech: s.tech && typeof s.tech === 'object' ? s.tech : {},
    trade: Object.assign({last: 0}, s.trade || {}),
    armies: [], fleets: [], convoys: [],
    reports: Array.isArray(s.reports) ? s.reports : [],
    seq: s.seq || 1,
    dip: Object.assign(defaultDip(), s.dip || {}),
    pirates: Object.assign({next: Date.now() + 480000, wave: 1, raids: 0}, s.pirates || {}),
    islands: world.islands, towns: world.towns,
    islandSel: 0,
    t: s.t || Date.now(),
    log: Array.isArray(s.log) && s.log.length ? s.log : [{t: Date.now(), x: '世界已建立'}]
  };

  // 城池：舊版單城 → 放去青螺島 0 號格；多城按次序排
  const rawCities = Array.isArray(s.cities) && s.cities.length
    ? s.cities
    : [{id: 1, name: s.name || CITY_NAMES[0], island: s.island, res: s.res, lv: s.lv,
        build: s.build, train: s.train, troops: s.troops, ships: s.ships, founded: s.t}];

  rawCities.forEach((c, i) => {
    // 舊存檔：放去同「島嶼特產」相符嘅島，保持加成一致
    const match = c.island && c.island.r ? (ISLE_LAYOUT.find(x => x.res === c.island.r) || {}).id : null;
    const islandId = c.islandId != null ? c.islandId
      : (match != null ? match : Math.floor(i / TOWNS_PER_ISLE) % ISLE_LAYOUT.length);
    const slot = c.slot != null ? c.slot : i % TOWNS_PER_ISLE;
    const mc = makeCity(c.id || i + 1, c.name || CITY_NAMES[i] || ('城池' + (i + 1)),
                        isleIsland(islandId), islandId, slot);
    Object.assign(mc, c, {
      islandId, slot, island: isleIsland(islandId),
      res: Object.assign({wood: 0, clay: 0, iron: 0, crop: 0}, c.res || {}),
      lv: Object.assign({}, DEFAULT_LV, c.lv || {}),
      troops: Object.assign(defaultTroops(), c.troops || {}),
      ships: Object.assign(defaultShips(), c.ships || {}),
      train: Array.isArray(c.train) ? c.train : [],
      build: c.build || null
    });
    // 舊存檔：把 lv 轉成地塊
    const plots = defaultPlots();
    if (!Array.isArray(c.plots) || !c.plots.length){
      let slot = 0;
      const put = (key, lv) => {
        if (!lv || slot >= PLOT_COUNT) return;
        plots[slot].key = key; plots[slot].lv = lv; slot++;
      };
      put('main', (c.lv && c.lv.main) || 1);
      ['woodcutter','claypit','ironmine','cropland'].forEach(k => put(k, (c.lv && c.lv[k]) || 0));
      ['warehouse','granary','barracks','rally','smithy','academy','port','shipyard','palace'].forEach(k => put(k, (c.lv && c.lv[k]) || 0));
      mc.plots = plots;
    } else {
      mc.plots = c.plots.map((pl, i) => ({i, key: pl.key || null, lv: pl.lv || 0, dmg: pl.dmg || 0}));
    }
    syncLv(mc);
    st.cities.push(mc);
    claimTown(st.towns, islandId, slot, mc);
  });
  st.active = 0;

  // 舊敵村：保留名／防禦／資源，塞入未用格
  const olds = (Array.isArray(s.map) ? s.map : Array.isArray(s.towns) ? s.towns : [])
    .filter(t => t && t.type === 'village' || (t && t.type === 'enemy'));
  const free = () => st.towns.filter(t => t.type === 'enemy');
  olds.forEach((o, i) => {
    const slotTown = free()[i];
    if (!slotTown) return;
    slotTown.name = o.name || slotTown.name;
    slotTown.tier = o.tier || slotTown.tier;
    slotTown.def = o.def || slotTown.def;
    if (o.loot) slotTown.loot = Object.assign({wood:0,clay:0,iron:0,crop:0}, o.loot);
    if (o.max) slotTown.max = Object.assign({wood:0,clay:0,iron:0,crop:0}, o.max);
    if (o.fac) slotTown.fac = o.fac;
    if (o.sea && o.sea.owner === 'player'){ slotTown.sea = {def: 0, owner: 'player'}; }
  });

  // 舊行軍：直接把部隊／船隻退回本城（地圖重排，舊座標已無意義）
  const back = (list, key) => {
    (Array.isArray(list) ? list : []).forEach(a => {
      const home = st.cities[a.city == null ? 0 : a.city] || st.cities[0];
      if (!home) return;
      if (key === 'troops') Object.keys(a.u || {}).forEach(k => home.troops[k] = (home.troops[k] || 0) + a.u[k]);
      if (key === 'ships') Object.keys(a.ships || {}).forEach(k => home.ships[k] = (home.ships[k] || 0) + a.ships[k]);
      if (key === 'convoy') RES.forEach(r => { home.res[r] = (home.res[r] || 0) + ((a.res || {})[r] || 0); });
    });
  };
  back(s.armies, 'troops');
  back(s.fleets, 'ships');
  back(s.convoys, 'convoy');

  if (typeof st.rp !== 'number' || !isFinite(st.rp)) st.rp = 0;
  return st;
}

function load(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(SAVE) || 'null'); }catch(e){ s = null; }
  state = normalizeState(s);
  bindCityAliases();
  offlineCatchup();
}

/* ---------------- 數值 ---------------- */
const capWOf = lv => Math.round(800 * Math.pow(1.42, (lv.warehouse || 1) - 1));
const capGOf = lv => Math.round(800 * Math.pow(1.42, (lv.granary || 1) - 1));
const capW = () => capWOf(state.lv);
const capG = () => capGOf(state.lv);
const capOfCity = (city, r) => r === 'crop' ? capGOf(city.lv) : capWOf(city.lv);
const capOf = r => r === 'crop' ? capG() : capW();

const prodOfLv = lv => lv ? 6 * Math.pow(1.27, lv - 1) : 0;
const prodOfPlot = pl => (pl && pl.key && B[pl.key].prod === undefined) ? 0 : 0;
const prodMin = r => {
  const city = state.cities[state.active];
  const key = RESKEY[r];
  let sum = 0;
  (city.plots || []).forEach(pl => { if (pl.key === key) sum += prodOfLv(pl.lv); });
  return sum * ecoMult() * islandMult(r);
};
const upkeep = () => sum(state.troops) * 1;   // 每兵每分鐘食 1 穀物

/* ---- 科技／島嶼加成 ---- */
const brLv = br => Object.keys(TECHS).filter(k => TECHS[k].br === br && state.tech[k]).length;
const ecoMult   = () => (1 + 0.08 * brLv('eco')) *
  (1 + 0.08 * Math.max(0, wonderLv(state.cities[state.active].islandId, 'eco') - 1));   // 經濟＋神殿
const sciMult   = () => 1 + 0.15 * brLv('sci');                       // 科學：研究點
const buildMult = () => Math.max(0.4, 1 - 0.05 * brLv('sci'));         // 科學：建造時間
const milMult   = () => 1 + 0.06 * brLv('mil') + 0.08 * Math.max(0, wonderLv(state.cities[state.active].islandId, 'mil') - 1) + (state.dip && FACTIONS.some(f => (state.dip[f.k]||{}).treaty === 'ally') ? 0.08 : 0);  // 軍事：攻擊＋同盟
const navSpeed  = () => 1 + 0.08 * brLv('nav');                       // 航海：行軍速度
const navCap    = () => 1 + 0.10 * brLv('nav') + (state.tech.mil3 ? 0.10 : 0);  // 航海／攻城工學：載量
const islandMult = r => (state.island && state.island.r === r) ? 1.30 : 1;
const rpRate = () => state.lv.academy ? (2 + 3 * state.lv.academy) * sciMult() *
  (1 + 0.08 * Math.max(0, wonderLv(state.cities[state.active].islandId, 'sci') - 1)) : 0;
const island = () => ISLANDS.find(x => x.r === (state.island||{}).r) || ISLANDS[0];

/* ---- 神蹟（島中央，全島共享） ---- */
function wonderOf(islandId){
  const isl = state.islands.find(i => i.id === islandId);
  if (!isl) return null;
  if (!isl.wonder) isl.wonder = {type: WONDER_ORDER[(isl.id || 0) % WONDER_ORDER.length], lv: 1};
  return isl.wonder;
}
function wonderLv(islandId, eff){
  const w = wonderOf(islandId);
  if (!w) return 0;
  const def = WONDERS[w.type];
  return def && def.eff === eff ? (w.lv || 1) : 0;
}
const wonderMult = (eff, step) => 1 + (step || 0.08) * Math.max(0, wonderLv(state.cities[state.active].islandId, eff) - 1);
function wonderCost(lv){ return {wood: 400*lv, clay: 350*lv, iron: 300*lv, crop: 250*lv}; }
function upgradeWonder(){
  const isl = state.islands.find(i => i.id === state.cities[state.active].islandId);
  const w = wonderOf(isl.id);
  if ((w.lv || 1) >= 10) return toast('神蹟已達最高等級');
  const c = wonderCost(w.lv || 1);
  if (!afford(c)) return toast('資源不足');
  pay(c); w.lv = (w.lv || 1) + 1;
  addLog(`${isl.n} 神蹟升到 Lv.${w.lv}`);
  dirty = true; save(); paint(); toast(`神蹟升至 Lv.${w.lv}`);
}

/* ---- 海軍 ---- */
const shipPower = ships => Object.keys(ships || {}).reduce((s,k) => s + (ships[k]||0) * (SHIPS[k] ? SHIPS[k].atk : 0), 0);
const fleetPower = ships => shipPower(ships) * milMult() * (1 + 0.08 * ((state.lv.shipyard||0) - 1 > 0 ? (state.lv.shipyard-1) : 0));
const shipSpeed = () => 1 + 0.06 * brLv('nav');

/* ---- 外交 ---- */
const dipOf = k => (state.dip && state.dip[k]) || {rel: 0, treaty: 'none'};
const treatyOf = k => dipOf(k).treaty;
const hasAlly = () => FACTIONS.some(f => treatyOf(f.k) === 'ally');
const lootFactionBonus = fac => treatyOf(fac) === 'war' ? 1.5 : 1;
const tradeDipBonus = () => treatyOf('merch') === 'trade' ? 0.10 : 0;

/* ---- 地塊（plot）系統：每塊地獨立一座建築、獨立等級 ---- */
function syncLv(city){
  const lv = {};
  Object.keys(DEFAULT_LV).forEach(k => lv[k] = 0);
  (city.plots || []).forEach(pl => {
    if (pl.key && pl.lv > (lv[pl.key] || 0)) lv[pl.key] = pl.lv;
  });
  city.lv = lv;
  return lv;
}
const plotCount = (city, key) => (city.plots || []).filter(p => p.key === key).length;
function canPlace(city, key){
  if (!B[key]) return '未知建築';
  if (!B[key].multi && plotCount(city, key) > 0) return `${B[key].n} 只可以起一座`;
  return null;
}
function freePlot(city){ return (city.plots || []).findIndex(p => !p.key); }

function openPlot(i, want){ modal = {type: 'p', i, want: want || null}; renderModal(); }

function placeBuilding(i, key){
  const city = state.cities[state.active];
  const pl = city.plots[i];
  if (!pl) return;
  if (pl.key) return toast('呢塊地已經有建築');
  if (city.build) return toast('工人正在忙，等佢做完先');
  const bad = canPlace(city, key); if (bad) return toast(bad);
  const lock = lockedBy(key); if (lock) return toast(lock);
  const c = upgradeCost(key, 1);
  if (!afford(c)) return toast('資源不足');
  pay(c);
  const sec = upgradeTime(key, 1);
  city.build = {city: state.active, plot: i, key, target: 1, start: Date.now(), end: Date.now() + sec * 1000};
  addLog(`${i + 1} 號地盤動工：${B[key].n}`);
  dirty = true; closeModal(); save(); paint();
  toast(`動工：${B[key].n}（${tstr(sec * 1000)}）`);
}

function upgradePlot(i){
  const city = state.cities[state.active], pl = city.plots[i];
  if (!pl || !pl.key) return;
  if (city.build) return toast('工人正在忙，等佢做完先');
  if (pl.lv >= MAXLV) return toast('已經最高等級');
  const target = pl.lv + 1;
  const lock = lockedBy(pl.key); if (lock) return toast(lock);
  const c = upgradeCost(pl.key, target);
  if (!afford(c)) return toast('資源不足');
  pay(c);
  const sec = upgradeTime(pl.key, target);
  city.build = {city: state.active, plot: i, key: pl.key, target, start: Date.now(), end: Date.now() + sec * 1000};
  addLog(`${i + 1} 號地盤：${B[pl.key].n} 升 Lv.${target}`);
  dirty = true; closeModal(); save(); paint();
  toast(`${B[pl.key].n} 升級中（${tstr(sec * 1000)}）`);
}

function demolishPlot(i){
  const city = state.cities[state.active], pl = city.plots[i];
  if (!pl || !pl.key) return;
  if (pl.key === 'main') return toast('村莊大樓唔可以拆');
  if (city.build) return toast('工人正在忙');
  const c = upgradeCost(pl.key, pl.lv), refund = {};
  RES.forEach(r => refund[r] = Math.floor((c[r] || 0) * 0.4));
  RES.forEach(r => city.res[r] = clamp(city.res[r] + refund[r], 0, capOfCity(city, r)));
  addLog(`拆掉 ${B[pl.key].n}（Lv.${pl.lv}），回收四成材料`);
  pl.key = null; pl.lv = 0;
  syncLv(city);
  dirty = true; closeModal(); save(); paint(); toast('已拆卸，回收四成材料');
}

function upgradeCost(key, target){
  const d = B[key], m = Math.pow(1.30, Math.max(0, target - 2)), c = {};
  RES.forEach(r => c[r] = Math.round((d.base[r] || 0) * m));
  return c;
}
function upgradeTime(key, target){
  let s = B[key].t * Math.pow(1.32, Math.max(0, target - 2));
  s *= 1 - 0.02 * (state.lv.main - 1);
  s *= buildMult();
  return Math.max(5, Math.round(s));
}
function lockedBy(key){
  const req = B[key].req; if (!req) return null;
  for (const k in req) if (state.lv[k] < req[k]) return `需要 ${B[k].n} Lv.${req[k]}`;
  return null;
}
function afford(c){ return RES.every(r => state.res[r] >= (c[r] || 0) - 0.001); }
function pay(c){ RES.forEach(r => state.res[r] = Math.max(0, state.res[r] - (c[r] || 0))); }
function costLeft(c){ return RES.reduce((s,r)=> s + Math.max(0, (c[r]||0) - state.res[r]), 0); }

const atkOf = u => Object.keys(u).reduce((s,k)=> s + (u[k]||0) * U[k].atk, 0);
const speedOf = u => Math.min(...Object.keys(u).filter(k=>u[k]>0).map(k=>U[k].spd), 99);

/* ---------------- 動作 ---------------- */
function startBuild(key){
  if (state.build) return toast('工人正在忙，等佢做完先');
  const target = state.lv[key] + 1;
  if (target > MAXLV) return toast('已經最高等級');
  const lock = lockedBy(key); if (lock) return toast(lock);
  const c = upgradeCost(key, target);
  if (!afford(c)) return toast('資源不足');
  pay(c);
  const sec = upgradeTime(key, target);
  state.build = {key, target, start: Date.now(), end: Date.now() + sec*1000};
  addLog(`${B[key].n} 開始升級至 Lv.${target}`);
  dirty = true; closeModal(); save(); paint(); toast(`${B[key].n} 開始升級（${tstr(sec*1000)}）`);
}

function train(unit, n, kind){
  kind = kind || 'land';
  const isShip = kind === 'ship';
  const d = isShip ? SHIPS[unit] : U[unit];
  if (isShip && state.lv.shipyard < 1) return toast('要先起船塢（需港口 Lv.1、村莊大樓 Lv.3）');
  if (!isShip && state.lv.barracks < 1) return toast('要先起兵營（需村莊大樓 Lv.3）');
  if (!d) return;
  const total = {};
  RES.forEach(r => total[r] = (d.cost[r] || 0) * n);
  if (!afford(total)) return toast('資源不足');
  pay(total);
  const spd = isShip ? 1 + 0.10 * state.lv.shipyard : 1 + 0.12 * state.lv.barracks;
  const dur = Math.max(2, d.t / spd) * 1000;
  let t = state.train.length ? state.train[state.train.length - 1].end : Date.now();
  for (let i=0;i<n;i++){ t += dur; state.train.push({u:unit, kind, end:t}); }
  addLog(`${isShip ? '船塢' : '兵營'}開始建造 ${n} ${isShip ? '艘' : '名'}${d.n}`);
  dirty = true; save(); paint(); toast(`建造 ${n} ${isShip ? '艘' : '名'}${d.n}`);
}

function dispatch(tileId){
  if (state.lv.rally < 1) return toast('要先起集結點（需村莊大樓 Lv.2）');
  const u = {}; let any = false;
  document.querySelectorAll('#modal-card [data-u]').forEach(inp => {
    let n = Math.floor(Number(inp.value) || 0);
    const k = inp.dataset.u;
    if (n > 0){ n = Math.min(n, state.troops[k]); u[k] = n; any = true; }
  });
  if (!any) return toast('未揀部隊');
  const tile = state.map.find(t => t.id === tileId);
  if (!tile || (tile.type !== 'enemy' && tile.type !== 'village')) return toast('目標無效');
  const dist = travelDist(tile);
  const travel = Math.max(6, Math.round(dist * 9 / speedOf(u) / navSpeed())) * 1000;
  for (const k in u) state.troops[k] -= u[k];
  state.armies.push({id: state.seq++, tile: tileId, u, at: Date.now() + travel, travel,
                     phase:'out', loot:null, city: state.active});
  addLog(`部隊出發前往 ${tile.name}`);
  dirty = true; closeModal(); save(); paint();
  toast(`部隊出發，${tstr(travel)} 後抵達`);
}

function resolveBattle(a){
  const t = state.map.find(x => x.id === a.tile);
  const power = Math.round(atkOf(a.u) * (1 + 0.05 * state.lv.smithy) * milMult());
  const win = power > t.def;
  const lf = win ? clamp(0.08 + 0.42 * (t.def / Math.max(1, power)), 0.08, 0.85) : 1;
  let gone = 0; const back = {};
  for (const k in a.u){
    const n = a.u[k];
    const lost = Math.min(n, Math.round(n * lf));
    back[k] = n - lost; gone += lost;
  }
  const loot = {wood:0, clay:0, iron:0, crop:0};
  if (win){
    const seaOk = !t.coastal || (t.sea && t.sea.owner === 'player');
    const cap = Object.keys(back).reduce((s,k)=> s + back[k] * U[k].cap, 0) * navCap()
                * (seaOk ? 1 : 0.4) * lootFactionBonus(t.fac);
    const avail = sum(t.loot);
    const take = Math.min(cap, avail);
    if (avail > 0 && take > 0){
      RES.forEach(r => { loot[r] = Math.floor(take * t.loot[r] / avail); t.loot[r] -= loot[r]; });
    }
  }
  a.u = back; a.loot = loot; a.phase = 'back'; a.at = a.at + a.travel;
  addLog(win ? `攻下 ${t.name}，帶回資源` : `進攻 ${t.name} 失敗，全軍覆沒`);
  state.reports.unshift({
    t: Date.now(), name: t.name, x: t.x, y: t.y, win,
    power, def: t.def, gone, back: Object.assign({}, back), loot
  });
  if (t.fac && state.dip && state.dip[t.fac] && win){
    const d = state.dip[t.fac];
    d.rel = Math.max(0, d.rel - 6);
    if (d.rel <= 0 && d.treaty !== 'war'){ d.treaty = 'war'; addLog(`${(FACTIONS.find(f=>f.k===t.fac)||{}).n} 好感見底，正式交戰`); }
  }
  if (state.reports.length > 40) state.reports.pop();
  dirty = true;
}

/* ---------------- 模擬 ---------------- */
function tick(){
  const now = Date.now();
  let dt = (now - state.t) / 1000;
  if (!(dt > 0)) dt = 0;
  state.t = now;

  if (dt > 0){
    // 資源
    const up = upkeep();
    RES.forEach(r => {
      let g = prodMin(r) / 60 * dt;
      if (r === 'crop') g -= up / 60 * dt;
      state.res[r] = clamp(state.res[r] + g, 0, capOf(r));
    });
    // 研究點（學院）
    const rr = rpRate();
    if (rr > 0) state.rp = Math.min(999999, state.rp + rr / 60 * dt);
    // 敵村補給
    const regen = dt / 600;
    state.map.forEach(t => {
      if (t.type !== 'enemy') return;
      RES.forEach(r => { t.loot[r] = Math.min(t.max[r], t.loot[r] + t.max[r] * regen); });
    });
    // 建造
    if (state.build && state.build.end <= now){
      const b = state.build;
      const city = state.cities[b.city == null ? state.active : b.city];
      if (city && b.plot != null && city.plots[b.plot]){
        city.plots[b.plot].key = b.key;
        city.plots[b.plot].lv = b.target;
        syncLv(city);
      } else if (city){
        city.lv[b.key] = b.target;
      }
      state.build = null; dirty = true;
      addLog(`${B[b.key].n} 完成（Lv.${b.target}）`);
      toast(`${B[b.key].n} 完成 Lv.${b.target}`);
    }
    // 訓練／造艦
    while (state.train.length && state.train[0].end <= now){
      const it = state.train.shift();
      if (it.kind === 'ship') state.ships[it.u] = (state.ships[it.u] || 0) + 1;
      else state.troops[it.u] = (state.troops[it.u] || 0) + 1;
      dirty = true;
    }
    // 軍隊
    for (let i = state.armies.length - 1; i >= 0; i--){
      const a = state.armies[i];
      if (a.phase === 'out' && a.at <= now){ resolveBattle(a); }
      if (a.phase === 'back' && a.at <= now){
        const home = state.cities[a.city == null ? state.active : a.city] || state.cities[state.active];
        for (const k in a.u) home.troops[k] = (home.troops[k] || 0) + a.u[k];
        RES.forEach(r => { if (a.loot && a.loot[r]) home.res[r] = clamp(home.res[r] + a.loot[r], 0, capOfCity(home, r)); });
        state.armies.splice(i, 1);
        dirty = true;
      }
    }
    // 艦隊
    for (let i = state.fleets.length - 1; i >= 0; i--){
      const f = state.fleets[i];
      if (f.phase === 'out' && f.at <= now) resolveSeaBattle(f);
      if (f.phase === 'back' && f.at <= now){
        if (state.fleets[i] === f){
          const home = state.cities[f.city == null ? state.active : f.city] || state.cities[state.active];
          Object.keys(f.ships).forEach(k => home.ships[k] = (home.ships[k] || 0) + f.ships[k]);
          state.fleets.splice(i, 1);
          dirty = true;
        }
      }
    }
    // 商船
    for (let i = state.convoys.length - 1; i >= 0; i--){
      const c = state.convoys[i];
      if (c.at <= now){
        const to = state.cities[c.to];
        if (to) RES.forEach(r => { to.res[r] = clamp((to.res[r] || 0) + (c.res[r] || 0), 0, capOfCity(to, r)); });
        addLog(`商船抵達 ${to ? to.name : '目的地'}，資源入庫`);
        state.convoys.splice(i, 1);
        dirty = true;
      }
    }
    // 海盜來襲
    if (state.pirates && now >= state.pirates.next){
      pirateRaid();
      state.pirates.next = now + 6 * 60000 * (1 + Math.random() * 0.7);
      save();
    }
  }
  paint();
}

function offlineCatchup(){
  const now = Date.now();
  let dt = (now - (state.t || now)) / 1000;
  if (!(dt > 5)) return;
  dt = Math.min(dt, 6 * 3600);        // 最多計 6 小時
  const up = upkeep();
  RES.forEach(r => {
    let g = prodMin(r) / 60 * dt;
    if (r === 'crop') g -= up / 60 * dt;
    state.res[r] = clamp(state.res[r] + g, 0, capOf(r));
  });
  if (state.build && state.build.end <= now){ state.lv[state.build.key] = state.build.target; state.build = null; }
  const rr = rpRate();
  if (rr > 0) state.rp = Math.min(999999, state.rp + rr / 60 * dt);
  while (state.train.length && state.train[0].end <= now){
    const it = state.train.shift();
    if (it.kind === 'ship') state.ships[it.u] = (state.ships[it.u] || 0) + 1;
    else state.troops[it.u] = (state.troops[it.u] || 0) + 1;
  }
  for (let i = state.armies.length - 1; i >= 0; i--){
    const a = state.armies[i];
    if (a.phase === 'out' && a.at <= now) resolveBattle(a);
    if (a.phase === 'back' && a.at <= now){
      const home = state.cities[a.city == null ? state.active : a.city] || state.cities[state.active];
      for (const k in a.u) home.troops[k] = (home.troops[k] || 0) + a.u[k];
      RES.forEach(r => { if (a.loot && a.loot[r]) home.res[r] = clamp(home.res[r] + a.loot[r], 0, capOfCity(home, r)); });
      state.armies.splice(i, 1);
    }
  }
  for (let i = (state.fleets || []).length - 1; i >= 0; i--){
    const f = state.fleets[i];
    if (f.phase === 'out' && f.at <= now) resolveSeaBattle(f);
    if (f.phase === 'back' && f.at <= now){
      if (state.fleets[i] === f){
        const home = state.cities[f.city == null ? state.active : f.city] || state.cities[state.active];
        Object.keys(f.ships).forEach(k => home.ships[k] = (home.ships[k] || 0) + f.ships[k]);
        state.fleets.splice(i, 1);
      }
    }
  }
  for (let i = (state.convoys || []).length - 1; i >= 0; i--){
    const c = state.convoys[i];
    if (c.at <= now){
      const to = state.cities[c.to];
      if (to) RES.forEach(r => { to.res[r] = clamp((to.res[r] || 0) + (c.res[r] || 0), 0, capOfCity(to, r)); });
      state.convoys.splice(i, 1);
    }
  }
  state.t = now;
  dirty = true;
}

    if (n) n.textContent = fmt(v);
    const c = document.getElementById('r-' + r + '-c');

  const acc = d.prod ? `--${RM[d.prod].v.slice(2)}` : 'var(--ink)';

function tradeAmt(){
  const capN = 200 * (state.lv.port || 0);
  const stock = Math.floor(state.res[tradeSel.give] || 0);
  const want = tradeSel.n === 0 ? capN : tradeSel.n;
  return Math.max(0, Math.min(want, capN, stock));
}
const tradeRate = () => (tradeSel.give === (state.island || {}).r ? 0.75 : 0.5) + tradeDipBonus()
  + 0.05 * Math.max(0, wonderLv(state.cities[state.active].islandId, 'trade') - 1);

function researchTech(k){
  const d = TECHS[k];
  if (!d || state.tech[k]) return;
  if (state.lv.academy < 1) return toast('要先起學院（需村莊大樓 Lv.2）');
  if (d.req && !state.tech[d.req]) return toast(`要先研究「${TECHS[d.req].n}」`);
  if (state.rp < d.cost) return toast(`研究點不足（差 ${Math.ceil(d.cost - state.rp)} 點）`);
  state.rp -= d.cost;
  state.tech[k] = true;
  addLog(`完成研究：${d.n}`);
  dirty = true; save(); paint();
  toast(`研究完成：${d.n}`);
}

function tradeDo(){
  const port = state.lv.port || 0;
  if (port < 1) return toast('要先起港口（需村莊大樓 Lv.2）');
  const now = Date.now();
  const left = TRADE_CD - (now - (state.trade.last || 0));
  if (state.trade.last && left > 0) return toast(`商船未返（${tstr(left)}）`);
  if (tradeSel.give === tradeSel.take) return toast('付出同換取唔可以同一樣資源');
  const n = Math.floor(tradeAmt());
  if (n < 2) return toast('數量不足（最少 2，或倉庫冇貨）');
  const gain = Math.floor(n * tradeRate());
  state.res[tradeSel.give] = Math.max(0, state.res[tradeSel.give] - n);
  state.res[tradeSel.take] = clamp(state.res[tradeSel.take] + gain, 0, capOf(tradeSel.take));
  state.trade.last = now;
  addLog(`市場換貨：${RM[tradeSel.give].n} ${fmt(n)} → ${RM[tradeSel.take].n} ${fmt(gain)}`);
  dirty = true; save(); paint();
  toast(`換得 ${fmt(gain)} ${RM[tradeSel.take].n}`);
}

const cityCost = () => {
  const n = state.cities.length, m = Math.pow(1.9, n - 1);
  return {wood: Math.round(1200*m), clay: Math.round(1000*m), iron: Math.round(800*m), crop: Math.round(600*m)};
};
const maxCities = () => 1 + (state.lv.palace || 0);

function switchCity(i){
  if (i === state.active || !state.cities[i]) return;
  state.active = i; dirty = true; save(); paint();
}

function foundCity(){
  if (state.lv.palace < 1) return toast('要先起皇宮（需村莊大樓 Lv.3）');
  if (state.cities.length >= maxCities()) return toast(`皇宮 Lv.${state.lv.palace} 最多管 ${maxCities()} 座城`);
  if ((state.ships.colony || 0) < 1) return toast('要有一艘殖民船（船塢可造）');
  const c = cityCost();
  if (!afford(c)) return toast('資源不足');
  pay(c);
  state.ships.colony--;
  let spot = null;
  for (const isl of state.islands){
    for (let s = 0; s < TOWNS_PER_ISLE && !spot; s++){
      const tw = state.towns.find(t => t.islandId === isl.id && t.slot === s);
      if (tw && tw.type !== 'player') spot = {islandId: isl.id, slot: s};
    }
    if (spot) break;
  }
  if (!spot) return toast('世界已經冇空位');
  const id = Math.max(...state.cities.map(c => c.id)) + 1;
  const nm = CITY_NAMES[(id - 1) % CITY_NAMES.length] || ('城池' + id);
  const nc = makeCity(id, nm, isleIsland(spot.islandId), spot.islandId, spot.slot);
  state.cities.push(nc);
  claimTown(state.towns, spot.islandId, spot.slot, nc);
  addLog(`殖民船靠岸，${nm} 在${isleName(spot.islandId)}建立`);
  dirty = true; save(); paint(); toast(`${nm} 已建立`);
}

const CONVOY_BASE = 30000;
function convoyTime(a, b){
  const sa = state.cities[a].slot || 0, sb = state.cities[b].slot || 0;
  return CONVOY_BASE + 15000 * Math.abs(sa - sb);
}
function sendConvoy(to, res){
  if (!state.ships.transport) return toast('要有一艘運輸船（船塢建造）');
  const total = sum(res);
  if (total < 1) return toast('未揀資源');
  if ((state.ships.transport || 0) < 1) return toast('運輸船唔夠');
  RES.forEach(r => { state.res[r] = Math.max(0, state.res[r] - (res[r] || 0)); });
  const travel = convoyTime(state.active, to);
  state.convoys.push({id: state.seq++, from: state.active, to, res, at: Date.now() + travel, travel, phase: 'out'});
  addLog(`商船載貨去 ${state.cities[to].name}`);
  dirty = true; closeModal(); save(); paint(); toast(`商船出發，${tstr(travel)} 後到達`);
}

function openFleet(tileId){ modal = {type: 'f', id: tileId}; renderModal(); }

function dispatchFleet(tileId){
  if (state.lv.shipyard < 1) return toast('要先起船塢');
  const t = state.map.find(x => x.id === tileId);
  if (!t || !t.coastal) return toast('目標唔係沿岸村落');
  const ships = {}; let any = false;
  document.querySelectorAll('#modal-card [data-s]').forEach(inp => {
    let n = Math.floor(Number(inp.value) || 0);
    const k = inp.dataset.s;
    if (k === 'transport' || k === 'colony') return;
    n = Math.min(n, state.ships[k] || 0);
    if (n > 0){ ships[k] = n; any = true; }
  });
  if (!any) return toast('未揀戰船');
  const dist = travelDist(t);
  const travel = Math.max(8, Math.round(dist * 10 / shipSpeed())) * 1000;
  Object.keys(ships).forEach(k => state.ships[k] -= ships[k]);
  state.fleets.push({id: state.seq++, tile: tileId, ships, at: Date.now() + travel, travel,
                     phase: 'out', city: state.active});
  addLog(`艦隊出航，目標 ${t.name} 海域`);
  dirty = true; closeModal(); save(); paint();
  toast(`艦隊出航，${tstr(travel)} 後抵達`);
}

function seaPowerOf(ships){
  return Math.round(shipPower(ships) * milMult() * (1 + 0.08 * Math.max(0, (state.lv.shipyard || 1) - 1)));
}

function resolveSeaBattle(f){
  const t = state.map.find(x => x.id === f.tile);
  if (!t || !t.sea) return;
  const power = seaPowerOf(f.ships);
  const def = t.sea.def || 0;
  const win = power > def;
  const lf = win ? clamp(0.08 + 0.42 * (def / Math.max(1, power)), 0.08, 0.8) : 1;
  const back = {}; let gone = 0;
  Object.keys(f.ships).forEach(k => {
    const n = f.ships[k], lost = Math.min(n, Math.round(n * lf));
    back[k] = n - lost; gone += lost;
  });
  if (win){ t.sea.owner = 'player'; t.sea.def = Math.max(25, Math.round(def * 0.15)); }
  f.ships = back; f.phase = 'back'; f.at = f.at + f.travel;
  state.reports.unshift({kind: 'sea', t: Date.now(), name: t.name, x: t.x, y: t.y,
    win, power, def, gone, back: Object.assign({}, back)});
  if (state.reports.length > 40) state.reports.pop();
  addLog(win ? `奪取 ${t.name} 制海權` : `海戰失利：${t.name} 海域`);
  dirty = true;
}

const TREATY_NAME = {none: '中立', trade: '貿易協定', truce: '互不侵犯', ally: '軍事同盟', war: '交戰中'};

function dipAction(fk, act){
  const f = FACTIONS.find(x => x.k === fk);
  if (!f) return;
  const d = state.dip[fk] || (state.dip[fk] = {rel: 30, treaty: 'none'});
  if (act === 'gift'){
    if (!afford(DIP_ACTS.gift.cost)) return toast('資源不足');
    pay(DIP_ACTS.gift.cost);
    d.rel = Math.min(100, d.rel + DIP_ACTS.gift.rel);
    if (d.treaty === 'war' && d.rel >= 30) d.treaty = 'none';
    addLog(`送禮給 ${f.n}，好感 +${DIP_ACTS.gift.rel}`);
    toast(`${f.n} 好感 +${DIP_ACTS.gift.rel}`);
  } else if (act === 'war'){
    if (d.treaty === 'war') return toast('已經交戰中');
    d.rel = 0; d.treaty = 'war';
    addLog(`向 ${f.n} 宣戰`);
    toast(`已向 ${f.n} 宣戰`);
  } else {
    const A = DIP_ACTS[act];
    if (!A) return;
    if (d.treaty === act) return toast('已經簽咗');
    if (d.rel < A.rel) return toast(`好感不足（要 ${A.rel}，現時 ${Math.floor(d.rel)}）`);
    d.treaty = act;
    addLog(`與 ${f.n} 簽訂${A.n}`);
    toast(`${f.n}：${A.n}`);
  }
  dirty = true; save(); paint();
}

function pirateRaid(){
  const p = state.pirates;
  p.raids = (p.raids || 0) + 1;
  const pop = state.cities.reduce((s, c) => s + sum(c.lv), 0);
  const wave = 1 + Math.floor(pop / 45);
  p.wave = wave;
  if (treatyOf('pirate') === 'truce' || treatyOf('pirate') === 'ally'){
    addLog('海盜公會有協議，今次冇來犯');
    return;
  }
  const idx = Math.floor(Math.random() * state.cities.length);
  const city = state.cities[idx];
  const power = Math.round(150 * wave);
  const defPower = Math.round(shipPower(city.ships) * 1.15 * milMult());
  const win = defPower >= power;
  let lostShips = 0, stolen = 0;
  if (win){
    let kill = Math.min(sum(city.ships), Math.max(1, Math.round(sum(city.ships) * 0.12)));
    Object.keys(city.ships).forEach(k => {
      const d = Math.min(city.ships[k], kill); city.ships[k] -= d; kill -= d; lostShips += d;
    });
  } else {
    RES.forEach(r => { const take = Math.floor(city.res[r] * 0.12); city.res[r] -= take; stolen += take; });
    Object.keys(city.ships).forEach(k => { lostShips += city.ships[k]; city.ships[k] = 0; });
  }
  state.reports.unshift({kind: 'pirate', t: Date.now(), name: city.name, win, power, def: defPower,
    gone: lostShips, stolen});
  if (state.reports.length > 40) state.reports.pop();
  addLog(win ? `擊退海盜第 ${wave} 波（${city.name}）` : `海盜洗劫 ${city.name}，失去資源 ${fmt(stolen)}`);
  if (!win) toast(`海盜來襲！${city.name} 被搶走 ${fmt(stolen)} 資源`);
  dirty = true;
}

        <b>海盜來襲 · ${r.name}</b>
        <span class="rt">${clock(r.t)}</span>
      </div>
      <div class="rb">
        海盜戰力 <b>${fmt(r.power)}</b>　我方艦隊 <b>${fmt(r.def)}</b><br>
        ${r.win ? `損失 <b>${r.gone}</b> 艘船` : `被搶資源 <b>${fmt(r.stolen||0)}</b>　損失 <b>${r.gone}</b> 艘船`}

    </div>`;
    }
    return `

      <div class="rh">

        <b>${r.name}</b> <span class="sub">(${r.x},${r.y})</span>
        <span class="rt">${clock(r.t)}</span>

      </div>
    </div>`;
  }).join('');
  return `<div class="panel"><div class="ph"><h2>戰報</h2><span class="sub">最近 ${state.reports.length} 場</span></div>${rows}</div>`;
}

/* ---------------- 底部隊列 ---------------- */
function paintDock(){
  const now = Date.now();
  const chips = [];
  if (state.build){
    const b = state.build;
    const pct = clamp((now - b.start) / (b.end - b.start) * 100, 0, 100);
    chips.push(`<div class="chip">${ICON[B[b.key].ic]}
      <div style="min-width:0">
        <div>${B[b.key].n} → Lv.${b.target} <span class="tm" id="dq-build">${tstr(b.end-now)}</span></div>
        <div class="cp"><i id="dbp" style="width:${pct}%"></i></div>
      </div></div>`);
  }
  if (state.train.length){
    const it = state.train[0];
    const total = it.end - (state.train[1] ? 0 : it.end);
    chips.push(`<div class="chip">${ICON.sword}
      <div style="min-width:0">
        <div>${it.kind === 'ship' ? '造艦' : '訓練'} ${((it.kind === 'ship' ? SHIPS[it.u] : U[it.u]) || {n: it.u}).n} <span class="tm" id="dq-train">${tstr(it.end-now)}</span></div>
        <div class="cp"><i id="dtp"></i></div>
      </div></div>`);
  }
  (state.fleets || []).forEach(f => {
    const t = state.map.find(x => x.id === f.tile);
    const label = f.phase === 'out' ? `艦隊 → ${t ? t.name : '?'}` : '艦隊返航';
    const left = f.at - now;
    chips.push(`<div class="chip">${ICON.anchor}
      <div style="min-width:0">
        <div>${label} <span class="tm">${left > 0 ? tstr(left) : '—'}</span></div>
        <div class="cp"><i style="width:${clamp(100 - left / f.travel * 100, 0, 100)}%"></i></div>
      </div></div>`);
  });
  (state.convoys || []).forEach(c => {
    const to = state.cities[c.to];
    const left = c.at - now;
    chips.push(`<div class="chip">${ICON.ship}
      <div style="min-width:0">
        <div>商船 → ${to ? to.name : '?'} <span class="tm">${left > 0 ? tstr(left) : '—'}</span></div>
        <div class="cp"><i style="width:${clamp(100 - left / c.travel * 100, 0, 100)}%"></i></div>
      </div></div>`);
  });
  state.armies.forEach(a => {
    const t = state.map.find(x => x.id === a.tile);
    const label = a.phase === 'out' ? `出兵 ${t.name}` : `返程 ${t.name}`;
    const left = a.at - now;
    chips.push(`<div class="chip">${ICON[a.phase==='out'?'flag':'home']}
      <div style="min-width:0">
        <div>${label} <span class="tm">${left>0?tstr(left):'—'}</span></div>
        <div class="cp"><i style="width:${clamp(100-left/a.travel*100,0,100)}%"></i></div>
      </div></div>`);
  });
  $('#dock').innerHTML = chips.length ? chips.join('') : `<div class="idle">工人閒置 — 揀一座建築升級</div>`;
}
