    const rows = owned.length ? owned.map(k => `
      <div class="inp">
        <label>${U[k].n}<span style="color:${(CIVS.find(c=>c.k===U[k].civ)||{}).c};margin-left:6px;font-size:10px">${(CIVS.find(c=>c.k===U[k].civ)||{}).n||''}</span></label>
        <span class="own" id="own-${k}">有 ${state.troops[k]}</span>
        <input type="number" min="0" max="${state.troops[k]}" value="0" data-u="${k}">
      </div>`).join('') : `<div class="desc">未有任何部隊 — 先去兵營訓練。</div>`;
    card.innerHTML = `
      <button class="close" data-act="close">✕</button>
      <h3>${ICON.flag}${t.name}</h3>
      <div class="desc">座標 (${t.x},${t.y})　距離 ${dist} 格　敵方防禦 <b style="color:#8d3517">${fmt(t.def)}</b></div>
      <div class="desc">可掠奪：${RES.map(r=>`${RM[r].n} ${fmt(t.loot[r])}`).join('　')}</div>
      ${t.fac ? `<div class="desc">所屬：<b>${(FACTIONS.find(f=>f.k===t.fac)||{}).n}</b>（${TREATY_NAME[treatyOf(t.fac)]||'中立'}）${
        treatyOf(t.fac)==='war' ? '　·　宣戰中，掠奪 +50%' : ''}</div>` : ''}
      ${t.coastal ? `<div class="desc">${t.sea && t.sea.owner === 'player'
        ? '制海權：<b>我方</b>，可以搶足'
        : '制海權：<b>敵方</b>（海防 ' + fmt(t.sea ? t.sea.def : 0) + '）— 陸軍只搶到 40%，去<b>海軍</b>頁先打海戰'}</div>` : ''}
      <div class="kv" style="margin-top:10px"><span>我方可派出</span><span>${sum(state.troops)} 名</span></div>
      <div class="kv"><span>攻擊力合計</span><span id="m-atk">0</span></div>
      <div class="kv"><span>行軍時間（單程）</span><span id="m-travel">—</span></div>
      ${state.lv.rally ? '' : `<div class="desc" style="color:#a3452a;margin-top:8px">要先起集結點才可以出兵。</div>`}
      <div style="margin-top:10px">${rows}</div>
      <div class="foot">
        <button class="btn" data-act="all" data-k="${t.id}">全選</button>
        <button class="btn primary" data-act="go" data-k="${t.id}" ${state.lv.rally?'':'disabled'}>出兵</button>
      </div>`;
  }
  $('#modal').classList.remove('hidden');
}

function modalDynamic(){
  if (!modal) return;
  if (modal.type === 'f'){
    const pick = {};
    document.querySelectorAll('#modal-card [data-s]').forEach(inp => {
      const n = Math.max(0, Math.min(Math.floor(Number(inp.value) || 0), state.ships[inp.dataset.s] || 0));
      if (n > 0) pick[inp.dataset.s] = n;
    });
    const el = document.getElementById('m-seapow');
    if (el) el.textContent = Object.keys(pick).length ? fmt(seaPowerOf(pick)) : '0';
    return;
  }
  if (modal.type === 'b' && state.build && state.build.key === modal.key){
    const p = document.getElementById('m-prog');
    if (p) p.textContent = tstr(state.build.end - Date.now());
  }
  if (modal.type === 't'){
    const t = state.map.find(x => x.id === modal.id);
    const dist = t ? travelDist(t) : 0;
    let power = 0; const pick = {};
    document.querySelectorAll('#modal-card [data-u]').forEach(inp => {
      const n = Math.floor(Number(inp.value) || 0);
      const k = inp.dataset.u;
      const use = Math.max(0, Math.min(n, state.troops[k] || 0));
      power += use * U[k].atk;
      if (use > 0) pick[k] = use;
    });
    power = Math.round(power * (1 + 0.05 * state.lv.smithy) * milMult());
    const el = document.getElementById('m-atk');
    if (el) el.textContent = fmt(power);
    const tv = document.getElementById('m-travel');
    if (tv){
      const spd = Object.keys(pick).length ? speedOf(pick) : 0;
      tv.textContent = spd ? tstr(Math.max(6, Math.round(dist * 9 / spd / navSpeed())) * 1000) : '—';
    }
  }
}

/* ---------------- 主繪製 ---------------- */
let lastStage = '';

function renderStage(){
  const html = stage();
  $('#stage').innerHTML = html;
  lastStage = state.tab;
}

function paint(){
  paintTop();
  paintDock();
  if (dirty || lastStage !== state.tab){
    buildTabs();
    buildCityBar();
    renderStage();
    dirty = false;
  }
  // 建造卡進度條
  if (state.build){
    const b = state.build;
    const i = document.getElementById('bp-' + b.key);
    if (i) i.style.width = clamp((Date.now() - b.start) / (b.end - b.start) * 100, 0, 100) + '%';
  }
  // 發展頁動態數字（研究點／商船冷卻）
  const rpEl = document.getElementById('rp-now');
  if (rpEl) rpEl.textContent = fmt(state.rp);
  const cdEl = document.getElementById('trade-cd');
  if (cdEl){
    const left = state.trade.last ? Math.max(0, TRADE_CD - (Date.now() - state.trade.last)) : 0;
    cdEl.textContent = left > 0 ? '商船未返 ' + tstr(left) : '商船待命';
  }
  modalDynamic();
}

/* ---------------- 互動 ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, k = el.dataset.k;
  if (act === 'tab'){ state.tab = k; dirty = true; paint(); }
  else if (act === 'bld') openBuilding(k);
  else if (act === 'up') startBuild(k);
  else if (act === 'close') closeModal();
  else if (act === 'tile') openTile(Number(k));
  else if (act === 'train') train(el.dataset.u, Number(el.dataset.n));
  else if (act === 'civ'){ state.civ = k; dirty = true; paint(); }
  else if (act === 'tech') researchTech(k);
  else if (act === 'bship') train(el.dataset.u, Number(el.dataset.n), 'ship');
  else if (act === 'fleet') openFleet(Number(k));
  else if (act === 'plot') openPlot(Number(k));
  else if (act === 'wup') upgradeWonder();
  else if (act === 'wzoom'){
    const d = Number(k);
    wmView.s = clamp(wmView.s + d * 0.25, 0.8, 2.2);
    const inner = document.getElementById('wmapInner');
    if (inner) inner.style.transform = `translate(${wmView.x}px,${wmView.y}px) scale(${wmView.s})`;
  }
  else if (act === 'wonder'){
    const w = wonderOf(state.islands.find(i => i.id === state.islandSel).id);
    toast(`${WONDERS[w.type].n} Lv.${w.lv || 1}：${WONDERS[w.type].d}`);
  }
  else if (act === 'place') placeBuilding(Number(el.dataset.p), k);
  else if (act === 'pup') upgradePlot(Number(k));
  else if (act === 'pdem') demolishPlot(Number(k));
  else if (act === 'opisle'){
    if (wmMoved){ wmMoved = false; return; }
    state.islandSel = Number(k); state.tab = 'island'; dirty = true; paint();
  }
  else if (act === 'town') openTile(Number(k));
  else if (act === 'goslot'){
    const tw = state.towns.find(x => x.id === Number(k));
    const ci = tw ? state.cities.findIndex(c => c.id === tw.cityId) : -1;
    if (ci >= 0){ state.active = ci; state.tab = 'village'; dirty = true; save(); paint(); }
  }
  else if (act === 'gofleet') dispatchFleet(Number(k));
  else if (act === 'allsea'){
    document.querySelectorAll('#modal-card [data-s]').forEach(inp => { inp.value = state.ships[inp.dataset.s] || 0; });
    modalDynamic();
  }
  else if (act === 'swcity') switchCity(Number(k));
  else if (act === 'convoy'){ modal = {type:'c', id:Number(k)}; renderModal(); }
  else if (act === 'goconvoy'){
    const to = Number(k), res = {};
    document.querySelectorAll('#modal-card [data-r]').forEach(inp => {
      res[inp.dataset.r] = Math.max(0, Math.min(Math.floor(Number(inp.value) || 0), Math.floor(state.res[inp.dataset.r])));
    });
    sendConvoy(to, res);
  }
  else if (act === 'allres'){
    document.querySelectorAll('#modal-card [data-r]').forEach(inp => { inp.value = Math.floor(state.res[inp.dataset.r]); });
  }
  else if (act === 'found') foundCity();
  else if (act === 'dip') dipAction(el.dataset.f, el.dataset.a);
  else if (act === 'trade') tradeDo();
  else if (act === 'pick'){
    const side = el.dataset.side;
    if (side === 'n') tradeSel.n = Number(k);
    else tradeSel[side] = k;
    dirty = true; paint();
  }
  else if (act === 'go') dispatch(Number(k));
  else if (act === 'all'){
    document.querySelectorAll('#modal-card [data-u]').forEach(inp => {
      inp.value = state.troops[inp.dataset.u];
    });
    modalDynamic();
  }
  else if (act === 'save'){ save(); toast('已存檔'); }
  else if (act === 'reset'){
    if (confirm('重新開始？現有進度會清除。')){ localStorage.removeItem(SAVE); state = newState(); dirty = true; buildTabs(); paint(); toast('新村落已建立'); }
  }
});

let wmDrag = null, wmMoved = false;
document.addEventListener('pointerdown', e => {
  const m = e.target.closest('#worldmap');
  if (!m) return;
  wmDrag = {x: e.clientX, y: e.clientY, tx: wmView.x, ty: wmView.y};
  wmMoved = false;
});
document.addEventListener('pointermove', e => {
  if (!wmDrag) return;
  const dx = e.clientX - wmDrag.x, dy = e.clientY - wmDrag.y;
  if (Math.abs(dx) + Math.abs(dy) > 6) wmMoved = true;
  wmView.x = wmDrag.tx + dx; wmView.y = wmDrag.ty + dy;
  const inner = document.getElementById('wmapInner');
  if (inner) inner.style.transform = `translate(${wmView.x}px,${wmView.y}px) scale(${wmView.s})`;
});
document.addEventListener('pointerup', () => { wmDrag = null; });

document.addEventListener('input', e => {
  if (e.target.matches('#modal-card [data-u]')) modalDynamic();
});

/* ---------------- 啟動 ---------------- */
load();
// 支援 #map / #army / #reports 直接開該頁
const _hash = (location.hash || '').replace('#', '');
if (TABS.some(t => t.k === _hash)) state.tab = _hash;
buildTop();
buildTabs();
paint();
setInterval(tick, 500);
setInterval(save, 4000);
window.addEventListener('beforeunload', save);
</script>
</body>
